version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Runtime deps ship as fix(deps) so release-please cuts a release for them;
    # frontend deploys only on release (decisions/2026-10-01-batched-releases.md).
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    # 7-day cooldown on every ecosystem: a freshly published version (the
    # window where a hijacked release is usually caught and yanked) never
    # reaches a PR. Security updates are not subject to cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
        # YouTube-adjacent deps must get standalone PRs: ci.yml's
        # test-youtube-smoke guard matches on PR title, and a grouped PR
        # title would bypass it. These packages break on minor bumps often
        # enough that the repo pins them manually elsewhere (7-day age).
        exclude-patterns:
          - "youtubei.js"
          - "discord-player-youtubei"
          - "yt-dlp"
          - "youtube-dl-exec"
          - "play-dl"
    ignore:
      # react-hook-form 7.90.0 breaks handleSubmit in the MusicConfig tests
      # (onSubmit is never called). Held at 7.89.0 until a fixed release.
      - dependency-name: "react-hook-form"
        versions:
          - "7.90.0"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
