name: Docker build service
description: Set up Docker Buildx and build a service image with the repo-standard CI settings (tags, gha cache scopes, provenance/sbom off).
inputs:
    service:
        description: Service name, used for the image tag and gha cache scope.
        required: true
    file:
        description: Dockerfile path relative to the repo root.
        required: true
    target:
        description: Docker build target stage (empty for the default stage).
        required: false
        default: ''
    load:
        description: Load the built image into the local Docker daemon.
        required: false
        default: 'false'
    use-cache:
        description: >-
            Import AND export the gha layer cache for this service. Set to
            'false' on retries: BuildKit's "failed to calculate checksum of
            ref ...: not found" failure persists even with cache-from alone
            disabled (confirmed via repeated fresh-hash reruns), which points
            at cache-to instead — `mode=max` exports every intermediate
            layer as the build progresses, and a later stage's COPY --from
            can race against that same layer still being finalized for
            export. Disabling cache-to too on retries removes that export
            pressure entirely for a plain, uncached build.
        required: false
        default: 'true'
runs:
    using: composite
    steps:
        # ubuntu-latest ships ~30GB of preinstalled toolchains (dotnet, GHC,
        # Android SDK, Swift) this build never uses. BuildKit's own GC can
        # race a long multi-stage build under disk pressure and evict a
        # layer/blob a later step still needs — "failed to calculate
        # checksum of ref ...: not found" on a stage that just built
        # successfully. Free the unused toolchains before building so
        # BuildKit's GC has no reason to run mid-build.
        #
        # `docker buildx prune` runs first because a retry's leftover
        # builder from the first (failed) attempt is a docker-container
        # instance with its own BuildKit cache/volumes — `docker system
        # prune` operates on the classic docker engine and does not
        # reclaim that isolated state (setup-buildx-action only removes
        # the builder in its job-end post step, not between retries).
        - name: Free disk space
          shell: bash
          run: |
              docker buildx prune -af || true
              sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /opt/hostedtoolcache/CodeQL || true
              docker system prune -af --volumes || true
              df -h /
        # Pin the BuildKit daemon itself, not just the buildx CLI.
        # setup-buildx-action's docker-container driver otherwise pulls
        # whatever BuildKit tag buildx currently bundles - moby/buildkit
        # v0.32.0 released 2026-08-04, days before this "failed to
        # calculate checksum of ref ...: not found" flake started hitting
        # this repo's Docker builds at a high, sustained rate. Multiple
        # independent upstream reports of this exact error (moby/buildkit#4128,
        # docker/build-push-action#910/#934) trace to BuildKit-internal
        # snapshot/cache-key resolution bugs, and #910 was fixed by pinning
        # to an older BuildKit build. v0.31.0 (released 2026-06-17) is the
        # last release with real production mileage before v0.32.0.
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
          with:
              driver-opts: image=moby/buildkit:v0.31.0
        - name: Build ${{ inputs.service }}
          uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
          with:
              context: .
              file: ${{ inputs.file }}
              target: ${{ inputs.target }}
              push: false
              load: ${{ inputs.load }}
              tags: lucky-${{ inputs.service }}:ci
              provenance: false
              sbom: false
              cache-from: ${{ inputs.use-cache == 'true' && format('type=gha,scope={0}', inputs.service) || '' }}
              cache-to: ${{ inputs.use-cache == 'true' && format('type=gha,mode=max,scope={0}', inputs.service) || '' }}
              build-args: |
                  COMMIT_SHA=${{ github.sha }}
                  NPM_CACHE_KEY=${{ hashFiles('package-lock.json') }}
