name: Docker build service
description: Set up Docker Buildx and build a service image with the repo-standard CI settings (tags, gha cache scopes, provenance/sbom off).
inputs:
    service:
        description: Service name, used for the image tag and gha cache scope.
        required: true
    file:
        description: Dockerfile path relative to the repo root.
        required: true
    target:
        description: Docker build target stage (empty for the default stage).
        required: false
        default: ''
    load:
        description: Load the built image into the local Docker daemon.
        required: false
        default: 'false'
    use-cache:
        description: >-
            Import the gha layer cache for this service. Set to 'false' on
            retries: BuildKit's "failed to calculate checksum of ref ...: not
            found" failure comes from a stale/corrupted gha cache entry, and
            cache-from is scoped identically across retries within the same
            job, so a retry that reimports it fails identically instead of
            getting a fresh build.

            This action no longer exports (there is no cache-to) — see the
            cache-from comment below. The earlier note here about disabling
            cache-to on retries, from the 2026-08-14 evidence in PR #1956 and
            #1952, still applies to docker-publish.yml, which does export.
        required: false
        default: 'true'
runs:
    using: composite
    steps:
        # ubuntu-latest ships ~30GB of preinstalled toolchains (dotnet, GHC,
        # Android SDK, Swift) this build never uses. BuildKit's own GC can
        # race a long multi-stage build under disk pressure and evict a
        # layer/blob a later step still needs — "failed to calculate
        # checksum of ref ...: not found" on a stage that just built
        # successfully. Free the unused toolchains before building so
        # BuildKit's GC has no reason to run mid-build.
        #
        # `docker buildx prune` runs first because a retry's leftover
        # builder from the first (failed) attempt is a docker-container
        # instance with its own BuildKit cache/volumes — `docker system
        # prune` operates on the classic docker engine and does not
        # reclaim that isolated state (setup-buildx-action only removes
        # the builder in its job-end post step, not between retries).
        - name: Free disk space
          shell: bash
          run: |
              docker buildx prune -af || true
              sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /opt/hostedtoolcache/CodeQL || true
              docker system prune -af --volumes || true
              df -h /
        # Serialize BuildKit's own stage scheduling (issue #2015 follow-up).
        # Even with the gha cache fully disabled and every PR building alone
        # on its own runner VM, "failed to calculate checksum of ref ...:
        # not found" kept reproducing on COPY --from steps — proven to be a
        # BuildKit solver-level race under its default concurrent stage
        # execution, not a caching or cross-job concurrency issue (see
        # commit history on this file and Dockerfile). max-parallelism=1
        # forces one stage op at a time, trading some build speed to
        # eliminate the race outright rather than out-retry it.
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
          with:
              buildkitd-config-inline: |
                  [worker.oci]
                    max-parallelism = 1
                  [worker.containerd]
                    max-parallelism = 1
        - name: Build ${{ inputs.service }}
          uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
          with:
              context: .
              file: ${{ inputs.file }}
              target: ${{ inputs.target }}
              push: false
              load: ${{ inputs.load }}
              tags: lucky-${{ inputs.service }}:ci
              provenance: false
              sbom: false
              # Read the scope docker-publish.yml writes on every push to main
              # (that workflow builds all four services with mode=max under
              # scope=main-<service>). This job no longer writes a scope of its
              # own: every PR branch used to export its own mode=max scope, and
              # four services across several live branches had the repo's
              # Actions cache at 10.9GB against a 10GB limit (298 entries,
              # measured 2026-08-26). Branch scopes evicted each other, and the
              # npm caches nine jobs depend on, before any of them was reused --
              # while the import was empty anyway, because docker-build never
              # runs on push. One writer, many readers.
              cache-from: ${{ inputs.use-cache == 'true' && format('type=gha,scope=main-{0}', inputs.service) || '' }}
              build-args: |
                  COMMIT_SHA=${{ github.sha }}
                  NPM_CACHE_KEY=${{ hashFiles('package-lock.json') }}
