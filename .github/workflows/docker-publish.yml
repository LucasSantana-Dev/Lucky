name: Build & Push Docker Images

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'packages/**'
            - 'prisma/**'
            - 'Dockerfile'
            - 'Dockerfile.*'
            - 'nginx/**'
            - 'package*.json'
            - '.github/workflows/docker-publish.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/lucky

permissions:
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            # Required by github/codeql-action/upload-sarif so trivy findings
            # land in the repo's Code Scanning tab. See ADR 2026-05-16.
            security-events: write

        strategy:
            matrix:
                include:
                    - service: bot
                      dockerfile: Dockerfile
                      target: production-bot
                    - service: backend
                      dockerfile: Dockerfile
                      target: production-backend
                    - service: frontend
                      dockerfile: Dockerfile
                      target: production-frontend
                    - service: nginx
                      dockerfile: Dockerfile.nginx
                      target: ''

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - name: Log in to ghcr.io
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Serialized to match .github/actions/docker-build-service (issue
            # #2015 follow-up) — this workflow builds the same Dockerfile
            # stage graph and is equally exposed to the BuildKit
            # solver-level checksum race the CI validation matrix hit.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
              with:
                  buildkitd-config-inline: |
                      [worker.oci]
                        max-parallelism = 1
                      [worker.containerd]
                        max-parallelism = 1

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
                  tags: |
                      type=sha,prefix=
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  target: ${{ matrix.target || '' }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false
                  sbom: false
                  build-args: |
                      COMMIT_SHA=${{ github.sha }}
                      NPM_CACHE_KEY=${{ hashFiles('package-lock.json') }}
                  # Ref-scoped, matching .github/actions/docker-build-service.
                  # A bare service scope is shared with every other workflow
                  # building the same service, so a mode=max export written by
                  # one can land in the cache another reads (#2002).
                  cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.service }}

            - name: Smoke test yt-dlp
              if: matrix.service == 'bot'
              run: |
                # Docker registry refs must be lowercase; IMAGE_PREFIX preserves
                # the GitHub owner's case (LucasSantana-Dev), so normalize here.
                IMAGE="$(printf '%s' "${{ env.IMAGE_PREFIX }}-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')"
                docker run --rm "$IMAGE:${{ steps.meta.outputs.version }}" yt-dlp --version

            - name: Verify ESM module load — bot
              if: matrix.service == 'bot'
              run: |
                # ESM smoke test for the bot: trigger the recurrence.ts → rrule
                # import chain to catch CJS/ESM compatibility errors before deploy.
                # This imports the core recurrence utilities that the /remind command
                # uses. The rrule package is a CommonJS package whose named exports
                # aren't statically resolvable by Node's ESM loader, so this fires at
                # import-time when the module graph is evaluated—exactly the error
                # that #1842 escaped to production.
                #
                # Side-effect-free: recurrence.ts has no top-level async code or
                # side effects, only pure function definitions that use rrule.
                IMAGE="$(printf '%s' "${{ env.IMAGE_PREFIX }}-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')"
                docker run --rm "$IMAGE:${{ steps.meta.outputs.version }}" \
                  node --input-type=module -e "
                    try {
                      const { buildRecurrenceRule, computeNextOccurrence, isValidTimezone } =
                        await import('@lucky/shared/utils');
                      if (typeof buildRecurrenceRule !== 'function' ||
                          typeof computeNextOccurrence !== 'function' ||
                          typeof isValidTimezone !== 'function') {
                        throw new Error('recurrence utilities missing or malformed');
                      }
                      console.log('✓ ESM module load OK — recurrence utilities loaded');
                      process.exit(0);
                    } catch (error) {
                      const message = error instanceof Error ? error.message : String(error);
                      console.error('✗ ESM module load failed:', message);
                      process.exit(1);
                    }
                  "

            # Phase A of the image-scan rollout (ADR 2026-05-16). Runs against
            # the freshly-pushed image — audit-only, exit-code 0, never blocks
            # CI. Findings land in the Code Scanning tab via SARIF upload, one
            # category per service so matrix runs don't overwrite each other.
            # Phase B will tighten to severity HIGH,CRITICAL + exit-code 1
            # after 2 weeks of clean audits.
            - name: Normalize image ref
              id: imgref
              run: |
                IMAGE="$(printf '%s' "${{ env.IMAGE_PREFIX }}-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')"
                echo "ref=${IMAGE}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

            - name: Trivy image scan (audit-only)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ steps.imgref.outputs.ref }}
                  format: sarif
                  output: trivy-image-${{ matrix.service }}.sarif
                  severity: MEDIUM,HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '0'
                  vuln-type: os,library
                  # Exclude the yt-dlp pip venv (/opt/ytdlp, see Dockerfile).
                  # yt-dlp's extractor modules ship hardcoded public API and
                  # test tokens (jwt-token, aws-access-key-id rules) that are
                  # false positives against Lucky: they live in a third-party
                  # package and cannot be edited by us. See issue #1703.
                  skip-dirs: /opt/ytdlp/**

            - name: Upload Trivy SARIF
              if: always()
              uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
              with:
                  sarif_file: trivy-image-${{ matrix.service }}.sarif
                  category: trivy-image-${{ matrix.service }}
