name: Frontend E2E

on:
    pull_request:
        branches: [main, 'release/**']
        paths:
            - 'packages/frontend/**'
            - 'packages/shared/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/e2e.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Release-please PRs touch package.json/package-lock.json (version lines
    # only), which trips the paths filter above. Skip the 4 minute run when the
    # diff is a pure version bump (content check, not branch name; errors fail
    # open to running e2e). Not a required check, so a skipped e2e blocks nothing.
    release-only:
        name: Detect release-only diff
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            skip: ${{ steps.detect.outputs.skip }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Detect release-only diff
              id: detect
              run: |
                  BASE_SHA=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD) || BASE_SHA=""
                  skip=$(bash scripts/ci/release-only.sh "$BASE_SHA" HEAD) || skip=false
                  echo "skip=$skip" >> "$GITHUB_OUTPUT"

    e2e:
        name: Playwright — frontend
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: release-only
        # !cancelled() lets e2e run when detection failed (implicit success()
        # would skip it); an empty output then means run. Skip only on a
        # successful detection with skip=true. Superseded runs still cancel.
        if: ${{ !cancelled() && needs.release-only.outputs.skip != 'true' }}
        env:
            # This job runs a bare `npm ci` (needs the frontend build), so unlike
            # ci.yml/madge it can't use --ignore-scripts. Without this,
            # youtube-dl-exec's postinstall fetches the yt-dlp binary from GitHub
            # unauthenticated (~60/hr/IP) and flakes red on shared-runner rate
            # limits (#1827), matching bundle-size.yml's convention.
            YOUTUBE_DL_SKIP_DOWNLOAD: 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Generate Prisma client
              run: npm run db:generate

            - name: Build shared package
              run: npm run build:shared

            - name: Resolve Playwright version
              id: pw
              run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
              working-directory: packages/frontend

            # No --with-deps: the runner image already ships Chromium's runtime
            # libs, and the apt step only added fonts while the Azure mirror
            # crawled at ~40 kB/s, stalling the job up to its 20m timeout
            # (#2549). The browser CDN is fast; cache it anyway and bound each
            # attempt so a stall retries instead of eating the job.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

            - name: Install Playwright chromium
              timeout-minutes: 10
              run: |
                  for attempt in 1 2 3; do
                      timeout -k 30s 3m npx playwright install chromium && exit 0
                      echo "::warning::playwright install attempt $attempt failed or timed out"
                  done
                  exit 1
              working-directory: packages/frontend

            # visual/ is excluded: its baseline PNGs were captured on macOS
            # (*-chromium-darwin.png) and have no Linux counterpart, so
            # toHaveScreenshot() fails on every run here regardless of the
            # app under test. Tracked as follow-up (see PR description).
            - name: Run frontend e2e tests
              run: npx playwright test tests/e2e/*.spec.ts tests/e2e/performance --project=chromium --reporter=list,html
              working-directory: packages/frontend

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: playwright-report
                  path: packages/frontend/playwright-report
                  retention-days: 7
