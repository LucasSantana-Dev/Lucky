name: PR Labels

# Unified PR labeling: path-based labels (actions/labeler, config in
# .github/labeler.yml) plus size labels (codelytv/pr-size-labeler) in a single
# job. Merged from the former labeler.yml and pr-size.yml workflows.
# Uses pull_request_target so fork PRs get labeled; never add a checkout step
# that runs PR code under this trigger.

on:
    pull_request_target:
        types: [opened, synchronize]

permissions:
    contents: read
    pull-requests: write

jobs:
    label:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Label PR by changed files
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v6
              with:
                  sync-labels: true

            - name: Label PR by size
              uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1
              with:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  xs_label: 'size/xs'
                  xs_max_size: 10
                  s_label: 'size/s'
                  s_max_size: 50
                  m_label: 'size/m'
                  m_max_size: 200
                  l_label: 'size/l'
                  l_max_size: 500
                  xl_label: 'size/xl'
                  fail_if_xl: false
