name: Fork CI Auto-Approve

# Approves "action required" workflow runs for trusted external contributors so
# their CI does not wait on a manual click. Runs on pull_request_target to get
# actions:write on fork PRs. NEVER add a checkout step or any step that executes
# PR code here; this workflow only reads PR metadata and flips the approval bit.
# The runs it approves still execute under pull_request semantics (no secrets,
# read-only GITHUB_TOKEN).
#
# Trusted = author_association OWNER/MEMBER/COLLABORATOR/CONTRIBUTOR, or the
# login appears in the repo variable CI_AUTO_APPROVE_AUTHORS (comma-separated).
# A PR whose diff touches .github/ is never auto-approved, trusted or not.
# True first-timers get a comment instead; the team is pinged on Discord by the
# External PR Notify workflow.

on:
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions:
    actions: write
    pull-requests: write
    contents: read

jobs:
    auto-approve:
        name: Approve CI for trusted contributors
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Non-fork PRs never land in the "action required" state this
        # workflow exists to clear (that gate is fork-only), so skip the run
        # entirely instead of executing the script only to find nothing
        # pending. Trigger/permissions/pull_request_target semantics untouched.
        if: github.event.pull_request.head.repo.fork
        steps:
            - name: Approve pending runs
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  ALLOWLIST: ${{ vars.CI_AUTO_APPROVE_AUTHORS }}
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      const author = pr.user.login;
                      const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR', 'CONTRIBUTOR']);
                      const allowlist = (process.env.ALLOWLIST || '')
                          .split(',')
                          .map((s) => s.trim())
                          .filter(Boolean);
                      const trusted = trustedAssociations.has(pr.author_association) || allowlist.includes(author);

                      if (!trusted) {
                          core.info(`${author} (${pr.author_association}) is not trusted for auto-approval`);
                          // Comment only on open/reopen; commenting on every
                          // synchronize would spam the thread on each push.
                          if (context.payload.action === 'synchronize') return;
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: pr.number,
                              body: 'Thanks for the PR! CI on PRs from first-time contributors needs a one-time maintainer approval. The team has been notified and will approve the runs shortly.',
                          });
                          return;
                      }

                      // A fork PR runs the fork's own workflow files, so a diff
                      // under .github/ can change what an approved run executes
                      // and where (runs-on). Those always wait for a maintainer
                      // click, whoever the author is (#2403).
                      //
                      // listFiles reads the PR's live head, while the approval
                      // below targets the event's head SHA. The head is read
                      // before and after the listing: if either differs, a newer
                      // push happened and its own synchronize event decides.
                      const headMoved = async () => {
                          const { data } = await github.rest.pulls.get({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              pull_number: pr.number,
                          });
                          return data.head.sha !== pr.head.sha;
                      };
                      if (await headMoved()) {
                          core.notice(`PR #${pr.number} head moved past ${pr.head.sha}; leaving it to the newer event`);
                          return;
                      }
                      const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: pr.number,
                          per_page: 100,
                      });
                      if (await headMoved()) {
                          core.notice(`PR #${pr.number} head moved past ${pr.head.sha}; leaving it to the newer event`);
                          return;
                      }
                      // The API lists at most 3000 files; past that the diff
                      // cannot be checked, so it counts as touching .github/.
                      const touchesCi =
                          files.length >= 3000 ||
                          files.some((f) =>
                              [f.filename, f.previous_filename].some((name) => name?.startsWith('.github/')),
                          );
                      if (touchesCi) {
                          core.notice(`PR #${pr.number} changes files under .github/ (or too many to list); leaving its runs for manual approval`);
                          return;
                      }

                      const approvePending = async () => {
                          const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              head_sha: pr.head.sha,
                              event: 'pull_request',
                              per_page: 100,
                          });
                          const pending = runs.filter((r) => r.conclusion === 'action_required');
                          for (const run of pending) {
                              await github.rest.actions.approveWorkflowRun({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  run_id: run.id,
                              });
                              core.info(`approved run ${run.id} (${run.name})`);
                          }
                          return pending.length;
                      };

                      let approved = await approvePending();
                      // Runs register a few seconds after the event; sweep once more.
                      await new Promise((resolve) => setTimeout(resolve, 30000));
                      approved += await approvePending();
                      core.info(`approved ${approved} run(s) for ${author} @ ${pr.head.sha}`);
