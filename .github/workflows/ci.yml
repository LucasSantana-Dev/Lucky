name: CI/CD Pipeline

on:
    push:
        branches: [main, 'release/**']
    pull_request:
        branches: [main, 'release/**']
    merge_group:
        branches: [main, 'release/**']

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-shared:
        name: Build — shared
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Generate Prisma client
              run: npx prisma generate
            - name: Build shared package
              run: npm run build:shared
            - name: Upload shared artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-build
                  path: |
                      packages/shared/src/generated/prisma
                      packages/shared/dist
                  retention-days: 1

    checks:
        name: Checks
        runs-on: ubuntu-latest
        needs: build-shared
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Lint
              run: |
                  npm run lint --workspace=packages/frontend
                  npm run lint --workspace=packages/backend
                  npm run lint --workspace=packages/bot
                  npm run lint --workspace=packages/shared
            # Exits 1 on drift in either mode, so a single human-readable run
            # is the CI assertion. Absorbs the deleted path-portability.yml
            # workflow. ripgrep is NOT preinstalled on ubuntu-latest.
            - name: Path portability
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep jq
                  bash scripts/check-path-portability.sh
            - name: Verify shared package exports
              run: npm run verify:shared-exports
              env:
                  DATABASE_URL: postgresql://localhost:5432/test
            # `nginx -t` (Validate nginx config, below) is a SYNTAX check. A
            # config that parses fine and routes nothing passes it. This asserts
            # every backend route registered outside /api actually has a
            # `location` block, i.e. that the edge forwards it. The fall-through
            # shipped twice silently: /invite (#1888) and /webhooks/topgg-votes
            # (#2086). Pure file parsing — no build, no DB.
            - name: Verify nginx route parity
              run: npm run verify:nginx-routes
            # v2.40.0 crash-looped the bot at boot on a bare JSON import
            # (ERR_IMPORT_ATTRIBUTE_MISSING) and auto-rolled back. Nothing here
            # caught it: jest transpiles to CJS where the import is legal, and
            # `npm run build` compiles without ever loading the output.
            - name: Verify json import attributes
              run: npm run verify:json-imports
            # A missing translation key does NOT throw: i18next serves the
            # English string via fallbackLng. Correct at runtime, and exactly
            # why an untranslated feature is invisible without this gate.
            - name: Verify locale key parity
              run: npm run verify:locales
            # `scripts/` holds the release-side guards: the broadcast send
            # ledger, the http probe, the json-import gate. They had tests and
            # nothing ran them, so the guards on a one-off broadcast to real
            # servers were never enforced. Plain node, no build, no DB.
            - name: Test release scripts
              run: npm run test:scripts
            - name: Type check
              run: npm run type:check
            - name: Check documentation coverage
              run: npm run docs:check --workspace=packages/shared
            # This was `npm run build`, which was almost entirely duplicated
            # work. Counting the actual chain in this one job: `type:check`
            # above already runs the bot's `preflight` (db:generate +
            # build:shared), then `npm run build` ran db:generate +
            # build:shared itself, then its build:bot leg ran that same
            # preflight a third time -- all on top of the build-shared
            # artifact this job downloaded before any of it.
            #
            # Only the frontend leg is kept, because only it asserts something
            # `type:check` does not: `vite build` and the prerender step, which
            # fail on bundling and SSR errors that tsc --noEmit never sees.
            #
            # It has to run on push too, not just pull_request. bundle-size.yml
            # is pull_request-only and ci.yml's docker-build is
            # pull_request/merge_group-only, so on a push to main nothing else
            # bundles the frontend at all.
            - name: Build frontend (bundle + prerender gate)
              run: npm run build --workspace=packages/frontend

    test-shared:
        name: Test — shared
        runs-on: ubuntu-latest
        needs: build-shared
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run shared tests
              run: npm run test --workspace=packages/shared -- --ci --coverage
              env:
                  # Some shared service modules eagerly init Prisma at import time (#1249)
                  DATABASE_URL: postgresql://localhost:5432/test

    test-backend:
        name: Test — backend
        runs-on: ubuntu-latest
        needs: build-shared
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run backend tests
              run: npm run test --workspace=packages/backend -- --ci --coverage
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: coverage-backend
                  path: packages/backend/coverage/lcov.info
                  retention-days: 1

    test-bot:
        name: Test — bot
        runs-on: ubuntu-latest
        needs: build-shared
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            # Absorbed from the deleted queueresolver-canary.yml: guard against
            # discord-player major bumps beyond the version pinned in
            # package-lock.json before running the bot suites.
            - name: Check discord-player version
              id: discord_player
              run: |
                  VERSION=$(npm list discord-player 2>/dev/null | grep discord-player | head -1 | grep -oP '\d+\.\d+\.\d+')
                  PINNED=$(grep '"discord-player"' package-lock.json | head -1 | grep -oP '\d+\.\d+\.\d+')
                  echo "installed=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
            - name: Detect discord-player major bump beyond pinned
              run: |
                  PINNED_MAJOR=$(echo "${{ steps.discord_player.outputs.pinned }}" | cut -d. -f1)
                  INSTALLED_MAJOR=$(echo "${{ steps.discord_player.outputs.installed }}" | cut -d. -f1)
                  if [ "$INSTALLED_MAJOR" -gt "$PINNED_MAJOR" ]; then
                      echo "ERROR: discord-player MAJOR bump detected"
                      echo "Pinned: ${{ steps.discord_player.outputs.pinned }} (major: $PINNED_MAJOR)"
                      echo "Installed: ${{ steps.discord_player.outputs.installed }} (major: $INSTALLED_MAJOR)"
                      exit 1
                  fi
                  echo "discord-player version compatible (pinned: ${{ steps.discord_player.outputs.pinned }}, installed: ${{ steps.discord_player.outputs.installed }})"
            - name: Run bot tests
              run: npm run test --workspace=packages/bot -- --ci --coverage
            - name: Run music incident regression
              run: npm run test:music:incident
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: coverage-bot
                  path: packages/bot/coverage/lcov.info
                  retention-days: 1

    test-youtube-smoke:
        name: Test — YouTube smoke (dependency guard)
        runs-on: ubuntu-latest
        needs: build-shared
        # Only runs on dependabot/renovate pull_request events touching YouTube packages.
        if: |
          (github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]') && (
            contains(github.event.pull_request.title, 'youtubei.js') ||
            contains(github.event.pull_request.title, 'discord-player-youtubei') ||
            contains(github.event.pull_request.title, 'yt-dlp') ||
            contains(github.event.pull_request.title, 'youtube-dl-exec') ||
            contains(github.event.pull_request.title, 'play-dl')
          )
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run YouTube smoke test
              # Advisory dependency guard, not a coverage gate: a single smoke
              # spec covers ~0% of the codebase, so --coverage always fails the
              # global thresholds and makes this advisory job look red.
              run: YOUTUBE_SMOKE_TEST=true npm run test --workspace=packages/bot -- --testPathPatterns="youtube.smoke" --ci


    test-frontend:
        name: Test — frontend
        runs-on: ubuntu-latest
        needs: build-shared
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run frontend tests
              run: npm run test --workspace=packages/frontend -- --coverage --coverage.reporter=lcov --coverage.reporter=text
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: coverage-frontend
                  path: packages/frontend/coverage/lcov.info
                  retention-days: 1

    # Hard gate. Blocks merges if cycle count exceeds baseline.
    # Baseline: COUNT > 1 (permits 1 known residual type-only cycle).
    #
    # 1 known residual: types/CustomClient.ts > models/Command.ts > types/CommandData.ts
    # All imports in this cycle are `import type`; breaking it requires structural
    # refactoring (moving types to shared file) that cascades into command-loader
    # consumers (help.ts). Deferred pending command-loader contract review.
    #
    # See decisions/2026-05-16-next-refactor-target-bot-circular-deps.md.
    # The job name must stay exactly "madge / packages/bot": the branch ruleset
    # requires that check context (absorbed from the deleted madge.yml workflow).
    madge:
        name: madge / packages/bot
        runs-on: ubuntu-latest
        needs: build-shared
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Install madge
              # --ignore-scripts: this static-analysis job needs only the source
              # tree, not any postinstall binaries. Without it, the full install
              # runs youtube-dl-exec's postinstall, which fetches the yt-dlp
              # binary from GitHub releases unauthenticated and flakes on the
              # ~60/hr anonymous rate limit (blocked #1105). Matches the
              # --ignore-scripts convention already used throughout ci.yml.
              run: npm install --no-save madge@^7 --ignore-scripts
            - name: Run madge --circular on packages/bot/src
              run: |
                  npx madge --circular --extensions ts packages/bot/src \
                      | tee madge-bot.txt
                  COUNT=$(grep -cE '^[0-9]+\)' madge-bot.txt || echo 0)
                  echo "bot_cycles=$COUNT" >> "$GITHUB_OUTPUT"
                  {
                      echo "## madge circular deps - packages/bot/src"
                      echo ""
                      echo "**Cycle count:** $COUNT (max: 1)"
                      echo ""
                      echo '```'
                      cat madge-bot.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  if [ "$COUNT" -gt 1 ]; then
                      echo "❌ Cycle count exceeds baseline (> 1)" >&2
                      exit 1
                  fi
              id: madge

    detect-docker-changes:
        name: Detect Docker-relevant changes
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        outputs:
            relevant: ${{ steps.filter.outputs.relevant }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  fetch-depth: 0
            - name: Check for Docker-relevant changes
              id: filter
              run: |
                  BASE_SHA="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      # pull_request.base.sha is a snapshot from when the PR was
                      # opened/synced, not the live base branch tip — diffing
                      # against it directly can pick up unrelated commits merged
                      # to base after that point. Use the actual merge-base.
                      BASE_SHA=$(git merge-base "$BASE_SHA" HEAD)
                  fi
                  CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
                  echo "Changed files:"
                  echo "$CHANGED"
                  # Mirrors docker-publish.yml's paths: filter, plus this
                  # workflow file and the composite action it calls (so edits
                  # to the docker-build job/action definitions are still
                  # validated instead of silently reporting a false green).
                  # CHANGELOG.md is in the list because Dockerfile:152 copies it
                  # into the frontend image for the /changelog page, so a
                  # changelog-only PR does change an image and must be built.
                  # THIRD copy of this list: keep in sync with
                  # docker-publish.yml's push.paths and deploy.yml's
                  # docker_path_pattern.
                  if echo "$CHANGED" | grep -qE '^(packages/|prisma/|Dockerfile$|Dockerfile\.|nginx/|package.*\.json$|CHANGELOG\.md$|\.github/workflows/ci\.yml$|\.github/actions/docker-build-service/)'; then
                      echo "relevant=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "relevant=false" >> "$GITHUB_OUTPUT"
                  fi

    docker-build:
        name: Build — ${{ matrix.service }}
        runs-on: ubuntu-latest
        needs: detect-docker-changes
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.detect-docker-changes.outputs.relevant == 'true'
        concurrency:
            # Must include matrix.service: a shared group makes the matrix legs
            # cancel each other instead of cancelling superseded runs.
            group: docker-build-${{ github.ref }}-${{ matrix.service }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {service: bot, file: Dockerfile, target: production-bot}
                    - {service: backend, file: Dockerfile, target: production-backend}
                    - {service: frontend, file: Dockerfile, target: production-frontend}
                    - {service: nginx, file: Dockerfile.nginx, target: ''}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - name: Build ${{ matrix.service }}
              id: build
              uses: ./.github/actions/docker-build-service
              continue-on-error: true
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' }}
            # Retry on transient failure (buildx setup and build re-run
            # together, matching the previous separate retry steps). Root
            # cause (see issue #2015): a local BuildKit race resolving a
            # COPY --from=<stage> reference — "failed to calculate checksum
            # of ref ...: not found" — while that shared stage
            # (installed-deps) is concurrently extended by a second live
            # branch in the same build DAG. Confirmed NOT a gha-cache issue:
            # reproduces 6/6 with cache-from AND cache-to fully disabled
            # (#2013, #2002). use-cache: 'false' is kept on retries anyway
            # (harmless, avoids any residual cache-side variable) but the
            # real mitigation here is attempt count — it's a race, not
            # deterministic, so more attempts raise the odds one lands
            # clean. Four retries (five attempts total) until #2015's
            # Dockerfile restructure removes the race itself.
            - name: Build ${{ matrix.service }} - retry 1 on transient failure
              id: build-retry-1
              if: steps.build.outcome == 'failure'
              continue-on-error: true
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' }}
                  use-cache: 'false'
            - name: Build ${{ matrix.service }} - retry 2 on transient failure
              id: build-retry-2
              if: steps.build.outcome == 'failure' && steps.build-retry-1.outcome == 'failure'
              continue-on-error: true
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' }}
                  use-cache: 'false'
            - name: Build ${{ matrix.service }} - retry 3 on transient failure
              id: build-retry-3
              if: steps.build.outcome == 'failure' && steps.build-retry-1.outcome == 'failure' && steps.build-retry-2.outcome == 'failure'
              continue-on-error: true
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' }}
                  use-cache: 'false'
            - name: Build ${{ matrix.service }} - retry 4 on transient failure
              if: steps.build.outcome == 'failure' && steps.build-retry-1.outcome == 'failure' && steps.build-retry-2.outcome == 'failure' && steps.build-retry-3.outcome == 'failure'
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' }}
                  use-cache: 'false'
            # A built image is not a working image: the bot's native addons
            # (@discordjs/opus) and the baked Prisma engines only fail at
            # require()-time, which `docker build` never reaches. #1735 shipped a
            # Prisma engine that crash-looped 262x behind a green build. Load the
            # real production-bot image and require the modules for real.
            - name: Verify native modules load — bot
              if: matrix.service == 'bot'
              run: |
                  docker run --rm lucky-bot:ci node -e "
                    const { OpusEncoder } = require('@discordjs/opus');
                    const frame = new OpusEncoder(48000, 2).encode(Buffer.alloc(3840));
                    if (!frame.length) throw new Error('opus encoded an empty frame');
                    console.log('opus OK — encoded', frame.length, 'bytes');
                  "
            # Include files are the #1908/#1910 rollback class: a missing or
            # http-level-loaded include crashes nginx at boot, which
            # `docker build` never reaches. Gate per
            # decisions/2026-07-11-bluegreen-web-tier.md: `nginx -t` in the
            # real image must pass before merge.
            - name: Validate nginx config — nginx
              if: matrix.service == 'nginx'
              run: docker run --rm lucky-nginx:ci nginx -t

    docker-build-check:
        name: Build — Docker images
        runs-on: ubuntu-latest
        needs: [detect-docker-changes, docker-build]
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        steps:
            - name: Assert all builds passed
              run: |
                  if [[ "${{ needs.detect-docker-changes.result }}" != "success" ]]; then
                      echo "Detect-docker-changes did not complete successfully: ${{ needs.detect-docker-changes.result }}"
                      exit 1
                  fi
                  if [[ "${{ needs.detect-docker-changes.outputs.relevant }}" != "true" ]]; then
                      echo "No Docker-relevant changes in this diff — skipping validation."
                      exit 0
                  fi
                  if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
                      echo "Docker build result: ${{ needs.docker-build.result }}"
                      exit 1
                  fi

    quality-gate:
        # test-youtube-smoke intentionally excluded: advisory-only, runs on YouTube dependency PRs only
        name: Quality Gates
        runs-on: ubuntu-latest
        needs: [build-shared, checks, test-shared, test-backend, test-bot, test-frontend]
        if: always()
        steps:
            - name: Assert all jobs passed
              run: |
                  checks="${{ needs.checks.result }}"
                  shared="${{ needs.test-shared.result }}"
                  backend="${{ needs.test-backend.result }}"
                  bot="${{ needs.test-bot.result }}"
                  frontend="${{ needs.test-frontend.result }}"
                  if [[ "$checks" != "success" || "$shared" != "success" || "$backend" != "success" || "$bot" != "success" || "$frontend" != "success" ]]; then
                      echo "Job results: checks=$checks  test-shared=$shared  test-backend=$backend  test-bot=$bot  test-frontend=$frontend"
                      exit 1
                  fi

    sonar:
        name: SonarCloud Scan
        runs-on: ubuntu-latest
        needs: [test-backend, test-bot, test-frontend]
        # Fork PRs get no secrets, so SONAR_TOKEN is never present and the
        # token policy step would hard-fail this required check. Skip the job
        # there instead; a skipped required check counts as passing.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read
            pull-requests: read
        env:
            SONAR_TOKEN_PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: coverage-backend
                  path: packages/backend/coverage
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: coverage-bot
                  path: packages/bot/coverage
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: coverage-frontend
                  path: packages/frontend/coverage
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: temurin
                  java-version: '17'
            - name: Validate Sonar token policy
              if: env.SONAR_TOKEN_PRESENT != 'true' && github.actor != 'dependabot[bot]'
              run: |
                  echo "::error::SONAR_TOKEN is required for non-Dependabot runs."
                  exit 1
            - name: Skip Sonar scan for Dependabot without token
              if: env.SONAR_TOKEN_PRESENT != 'true' && github.actor == 'dependabot[bot]'
              run: echo "Skipping SonarCloud scan — no token for Dependabot."
            # First attempt is allowed to fail: the scanner-engine download from
            # scanner.sonarcloud.io intermittently 403s (transient CDN/provisioning),
            # which otherwise fails this required check and blocks merge on a flake.
            - name: SonarCloud Scan (PR — quality gate blocks merge)
              id: sonar_pr
              if: env.SONAR_TOKEN_PRESENT == 'true' && github.event_name == 'pull_request'
              continue-on-error: true
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
              with:
                  args: -Dsonar.qualitygate.wait=true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            # Retry once only when the first attempt failed. A real quality-gate
            # failure fails both attempts (so merge stays blocked); a transient
            # download 403 clears on the retry.
            - name: SonarCloud Scan (PR) — retry once on transient failure
              if: env.SONAR_TOKEN_PRESENT == 'true' && github.event_name == 'pull_request' && steps.sonar_pr.outcome == 'failure'
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
              with:
                  args: -Dsonar.qualitygate.wait=true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            # Push-to-main scan is informational only — its failure must never fail
            # the job (and thereby block the build→deploy chain). continue-on-error
            # makes "non-blocking" actually true.
            - name: SonarCloud Scan (main — informational, non-blocking)
              if: env.SONAR_TOKEN_PRESENT == 'true' && github.event_name == 'push'
              continue-on-error: true
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
              with:
                  args: -Dsonar.qualitygate.wait=false
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    security:
        name: Security
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-security-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Security audit
              run: npm run audit:high
            - name: Secrets scan
              run: npx secretlint "**/*"
