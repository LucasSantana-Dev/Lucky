name: CI/CD Pipeline

on:
    push:
        branches: [main, 'release/**']
    pull_request:
        branches: [main, 'release/**']
    merge_group:
        branches: [main, 'release/**']

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-shared:
        name: Build — shared
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: changes
        # Docs-only PRs (docs/**, decisions/**, .claude/**, *.md other than
        # CHANGELOG.md) skip the whole build+test chain below: a skipped
        # required check counts as passing. push/merge_group always build.
        if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Generate Prisma client
              run: npx prisma generate
            - name: Build shared package
              run: npm run build:shared
            - name: Upload shared artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-build
                  path: |
                      packages/shared/src/generated/prisma
                      packages/shared/dist
                  retention-days: 1

    checks:
        name: Checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [changes, build-shared]
        if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Lint
              run: |
                  npm run lint --workspace=packages/frontend
                  npm run lint --workspace=packages/backend
                  npm run lint --workspace=packages/bot
                  npm run lint --workspace=packages/shared
            # Exits 1 on drift in either mode, so a single human-readable run
            # is the CI assertion. Absorbs the deleted path-portability.yml
            # workflow. ripgrep is NOT preinstalled on ubuntu-latest; jq is.
            # apt is bounded (timeout + retries) so a hung mirror fails the
            # step in minutes instead of eating the whole job timeout.
            - name: Path portability
              run: |
                  pkgs=()
                  command -v rg >/dev/null 2>&1 || pkgs+=(ripgrep)
                  command -v jq >/dev/null 2>&1 || pkgs+=(jq)
                  if [ "${#pkgs[@]}" -gt 0 ]; then
                      apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
                      # One 300s budget for update+install, not 300s each.
                      deadline=$((SECONDS + 300))
                      sudo timeout --kill-after=30 300 apt-get "${apt_opts[@]}" update -qq
                      left=$((deadline - SECONDS))
                      [ "$left" -gt 0 ] || { echo "::error::apt budget (300s) used up by update"; exit 1; }
                      sudo timeout --kill-after=30 "$left" apt-get "${apt_opts[@]}" install -y -qq "${pkgs[@]}"
                  fi
                  bash scripts/check-path-portability.sh
            - name: Verify shared package exports
              run: npm run verify:shared-exports
              env:
                  DATABASE_URL: postgresql://localhost:5432/test
            # `nginx -t` (Validate nginx config, below) is a SYNTAX check. A
            # config that parses fine and routes nothing passes it. This asserts
            # every backend route registered outside /api actually has a
            # `location` block, i.e. that the edge forwards it. The fall-through
            # shipped twice silently: /invite (#1888) and /webhooks/topgg-votes
            # (#2086). Pure file parsing — no build, no DB.
            - name: Verify nginx route parity
              run: npm run verify:nginx-routes
            # v2.40.0 crash-looped the bot at boot on a bare JSON import
            # (ERR_IMPORT_ATTRIBUTE_MISSING) and auto-rolled back. Nothing here
            # caught it: jest transpiles to CJS where the import is legal, and
            # `npm run build` compiles without ever loading the output.
            - name: Verify json import attributes
              run: npm run verify:json-imports
            # A missing translation key does NOT throw: i18next serves the
            # English string via fallbackLng. Correct at runtime, and exactly
            # why an untranslated feature is invisible without this gate.
            - name: Verify locale key parity
              run: npm run verify:locales
            # `scripts/` holds the release-side guards: the broadcast send
            # ledger, the http probe, the json-import gate. They had tests and
            # nothing ran them, so the guards on a one-off broadcast to real
            # servers were never enforced. Plain node, no build, no DB.
            - name: Test release scripts
              run: npm run test:scripts
            - name: Type check
              run: npm run type:check
            - name: Check documentation coverage
              run: npm run docs:check --workspace=packages/shared
            # This was `npm run build`, which was almost entirely duplicated
            # work. Counting the actual chain in this one job: `type:check`
            # above already runs the bot's `preflight` (db:generate +
            # build:shared), then `npm run build` ran db:generate +
            # build:shared itself, then its build:bot leg ran that same
            # preflight a third time -- all on top of the build-shared
            # artifact this job downloaded before any of it.
            #
            # Only the frontend leg is kept, because only it asserts something
            # `type:check` does not: `vite build` and the prerender step, which
            # fail on bundling and SSR errors that tsc --noEmit never sees.
            #
            # It has to run on push too, not just pull_request. bundle-size.yml
            # is pull_request-only and ci.yml's docker-build is
            # pull_request/merge_group-only, so on a push to main nothing else
            # bundles the frontend at all.
            - name: Build frontend (bundle + prerender gate)
              run: npm run build --workspace=packages/frontend

    test-shared:
        name: Test — shared
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [changes, build-shared]
        if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run shared tests
              run: npm run test --workspace=packages/shared -- --ci --coverage
              env:
                  # Some shared service modules eagerly init Prisma at import time (#1249)
                  DATABASE_URL: postgresql://localhost:5432/test

    test-backend:
        name: Test — backend
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [changes, build-shared]
        if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run backend tests
              run: npm run test --workspace=packages/backend -- --ci --coverage
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: coverage-backend
                  path: packages/backend/coverage/lcov.info
                  retention-days: 1

    test-bot:
        name: Test — bot
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [changes, build-shared]
        if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            # Absorbed from the deleted queueresolver-canary.yml: guard against
            # discord-player major bumps beyond the version pinned in
            # package-lock.json before running the bot suites.
            - name: Check discord-player version
              id: discord_player
              run: |
                  VERSION=$(npm list discord-player 2>/dev/null | grep discord-player | head -1 | grep -oP '\d+\.\d+\.\d+')
                  PINNED=$(grep '"discord-player"' package-lock.json | head -1 | grep -oP '\d+\.\d+\.\d+')
                  echo "installed=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
            - name: Detect discord-player major bump beyond pinned
              run: |
                  PINNED_MAJOR=$(echo "${{ steps.discord_player.outputs.pinned }}" | cut -d. -f1)
                  INSTALLED_MAJOR=$(echo "${{ steps.discord_player.outputs.installed }}" | cut -d. -f1)
                  if [ "$INSTALLED_MAJOR" -gt "$PINNED_MAJOR" ]; then
                      echo "ERROR: discord-player MAJOR bump detected"
                      echo "Pinned: ${{ steps.discord_player.outputs.pinned }} (major: $PINNED_MAJOR)"
                      echo "Installed: ${{ steps.discord_player.outputs.installed }} (major: $INSTALLED_MAJOR)"
                      exit 1
                  fi
                  echo "discord-player version compatible (pinned: ${{ steps.discord_player.outputs.pinned }}, installed: ${{ steps.discord_player.outputs.installed }})"
            - name: Run bot tests
              run: npm run test --workspace=packages/bot -- --ci --coverage
            - name: Run music incident regression
              run: npm run test:music:incident
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: coverage-bot
                  path: packages/bot/coverage/lcov.info
                  retention-days: 1

    test-youtube-smoke:
        name: Test — YouTube smoke (dependency guard)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: build-shared
        # Only runs on dependabot/renovate pull_request events touching YouTube packages.
        if: |
          (github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]') && (
            contains(github.event.pull_request.title, 'youtubei.js') ||
            contains(github.event.pull_request.title, 'discord-player-youtubei') ||
            contains(github.event.pull_request.title, 'yt-dlp') ||
            contains(github.event.pull_request.title, 'youtube-dl-exec') ||
            contains(github.event.pull_request.title, 'play-dl')
          )
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run YouTube smoke test
              # Advisory dependency guard, not a coverage gate: a single smoke
              # spec covers ~0% of the codebase, so --coverage always fails the
              # global thresholds and makes this advisory job look red.
              run: YOUTUBE_SMOKE_TEST=true npm run test --workspace=packages/bot -- --testPathPatterns="youtube.smoke" --ci


    test-frontend:
        name: Test — frontend
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [changes, build-shared]
        if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Run frontend tests
              run: npm run test --workspace=packages/frontend -- --coverage --coverage.reporter=lcov --coverage.reporter=text
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: coverage-frontend
                  path: packages/frontend/coverage/lcov.info
                  retention-days: 1

    # Hard gate. Blocks merges if any circular dependency is found.
    # Baseline: COUNT > 0 (zero cycles tolerated).
    #
    # The last residual cycle (types/CustomClient.ts > models/Command.ts >
    # types/CommandData.ts) was removed by merging the three mutually
    # recursive files into types/CommandData.ts. See
    # decisions/2026-05-16-next-refactor-target-bot-circular-deps.md.
    # The job name must stay exactly "madge / packages/bot": the branch ruleset
    # requires that check context (absorbed from the deleted madge.yml workflow).
    madge:
        name: madge / packages/bot
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [changes, build-shared]
        # Required status check by name, so a skip here counts as passing.
        # If `changes` or build-shared FAILS, the implicit success() in this
        # `if` also makes this job skip (not fail) -- merge stays blocked
        # anyway because quality-gate independently checks both results and
        # hard-fails the "Quality Gates" required check in that case.
        if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Download shared artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-build
                  path: packages/shared
            - name: Install madge
              # --ignore-scripts: this static-analysis job needs only the source
              # tree, not any postinstall binaries. Without it, the full install
              # runs youtube-dl-exec's postinstall, which fetches the yt-dlp
              # binary from GitHub releases unauthenticated and flakes on the
              # ~60/hr anonymous rate limit (blocked #1105). Matches the
              # --ignore-scripts convention already used throughout ci.yml.
              run: npm install --no-save madge@^7 --ignore-scripts
            - name: Run madge --circular on packages/bot/src
              run: |
                  set -o pipefail
                  npx madge --circular --extensions ts packages/bot/src \
                      | tee madge-bot.txt
                  # grep -c always prints a numeric count, including 0 on no
                  # match; it just exits 1 in that case. The step runs under
                  # `bash -e`, so that exit status aborts the whole script at
                  # this assignment, failing the job on a clean tree. `|| true`
                  # swallows it. Don't use `|| echo 0` instead: that appends a
                  # second, spurious "0" line and breaks the comparison below.
                  COUNT=$(grep -cE '^[0-9]+\)' madge-bot.txt || true)
                  echo "bot_cycles=$COUNT" >> "$GITHUB_OUTPUT"
                  {
                      echo "## madge circular deps - packages/bot/src"
                      echo ""
                      echo "**Cycle count:** $COUNT (max: 0)"
                      echo ""
                      echo '```'
                      cat madge-bot.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  if [ "$COUNT" -gt 0 ]; then
                      echo "❌ Cycle count exceeds baseline (> 0)" >&2
                      exit 1
                  fi
              id: madge

    # Single early "what changed" job. Replaces the old detect-docker-changes
    # job (all-or-nothing Docker relevance) with two things:
    #   - `code`: is this a docs-only PR? (docs/**, decisions/**, .claude/**,
    #     and *.md files other than CHANGELOG.md don't count). Gates
    #     build-shared/checks/test-*/madge/sonar on pull_request only. Push
    #     and merge_group always run the full suite, same as before.
    #   - `services`: which of bot/backend/frontend/nginx actually need a
    #     Docker rebuild, derived from the Dockerfile COPY graph. Filtered on
    #     pull_request AND merge_group (matching detect-docker-changes' prior
    #     scope); push never reaches docker-build in this workflow at all
    #     (that's docker-publish.yml's job), so it gets the full list.
    changes:
        name: Detect changed files
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            code: ${{ steps.filter.outputs.code }}
            bot: ${{ steps.filter.outputs.bot }}
            backend: ${{ steps.filter.outputs.backend }}
            frontend: ${{ steps.filter.outputs.frontend }}
            nginx: ${{ steps.filter.outputs.nginx }}
            render: ${{ steps.filter.outputs.render }}
            services: ${{ steps.filter.outputs.services }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  fetch-depth: 0
            - name: Detect changed files
              id: filter
              run: |
                  EVENT="${{ github.event_name }}"
                  if [ "$EVENT" = "pull_request" ]; then
                      # pull_request.base.sha is a snapshot from when the PR was
                      # opened/synced, not the live base branch tip — diffing
                      # against it directly can pick up unrelated commits merged
                      # to base after that point. Use the actual merge-base.
                      BASE_SHA=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
                      CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
                  elif [ "$EVENT" = "merge_group" ]; then
                      CHANGED=$(git diff --name-only "${{ github.event.merge_group.base_sha }}" HEAD)
                  else
                      CHANGED=""
                  fi
                  echo "Changed files:"
                  echo "$CHANGED"

                  # `code`: only filtered on pull_request. push/merge_group keep
                  # running the full suite as today.
                  if [ "$EVENT" = "pull_request" ]; then
                      # `grep -v` exits 1 when every changed file matches the
                      # exclude pattern (the docs-only case). The default
                      # `bash -e` shell has no pipefail, so awk's exit 0 masks
                      # it today; `|| true` keeps "no code files matched" a
                      # value, not an error, if pipefail is ever turned on.
                      CODE_CHANGED=$(echo "$CHANGED" | grep -vE '^(docs/|decisions/|\.claude/)' | awk '!/\.md$/ || $0 == "CHANGELOG.md"') || true
                      if [ -n "$CODE_CHANGED" ]; then code=true; else code=false; fi
                  else
                      code=true
                  fi

                  # Release-please PRs change only the version fields in root
                  # package.json/package-lock.json plus CHANGELOG.md and the
                  # manifest. Judged by content (scripts/ci/release-only.sh),
                  # never by branch name: a dependency change inside a release
                  # PR returns false and runs everything. Errors fail open to
                  # the full suite. Required checks still report: skipped jobs
                  # count as passing and docker-build-check short-circuits on
                  # services=[].
                  release_only=false
                  if [ "$EVENT" = "pull_request" ]; then
                      release_only=$(bash scripts/ci/release-only.sh "$BASE_SHA" HEAD) || release_only=false
                      if [ "$release_only" = "true" ]; then code=false; fi
                  fi

                  # Per-service Docker relevance, derived by hand from the
                  # Dockerfile COPY lines (build-shared/build-bot/build-backend/
                  # build-frontend/production-* stages):
                  #   - packages/shared/**, prisma/**, root package*.json, and
                  #     the Dockerfile itself feed every node image: bot,
                  #     backend and frontend all COPY from build-shared /
                  #     installed-deps / deps-production-base.
                  #   - nginx/nginx.conf, nginx/upstream-active.conf, and
                  #     Dockerfile.nginx affect only the standalone nginx
                  #     image. nginx/frontend.conf is COPY'd into
                  #     production-frontend instead (Dockerfile, production-
                  #     frontend stage), so it affects frontend, not nginx.
                  #   - CHANGELOG.md is baked into the frontend image only
                  #     (Dockerfile:152, the /changelog page's raw import).
                  #   - .dockerignore shapes the build context for every
                  #     target built from this Dockerfile, so it forces all
                  #     four the same as a Dockerfile/ci.yml change.
                  #   - packages/render/** feeds only the render image (its own
                  #     Dockerfile and build context, no shared stages) and the
                  #     `rust` job.
                  #   - Changes to this workflow file or the
                  #     docker-build-service composite action can change how
                  #     ANY image is built, so they force a rebuild of all five.
                  # THIRD copy of this list: keep in sync with
                  # docker-publish.yml's push.paths and deploy.yml's
                  # docker_path_pattern (those still build all five
                  # unconditionally on push to main; only this per-PR/
                  # merge_group matrix is now selective).
                  if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
                      bot=false; backend=false; frontend=false; nginx=false; render=false
                      if [ "$release_only" = "true" ]; then
                          : # version-bump-only release PR: nothing to rebuild
                      elif echo "$CHANGED" | grep -qE '^(\.github/workflows/ci\.yml$|\.github/actions/docker-build-service/|\.dockerignore$)'; then
                          bot=true; backend=true; frontend=true; nginx=true; render=true
                      else
                          if echo "$CHANGED" | grep -qE '^(packages/shared/|prisma/|package.*\.json$|Dockerfile$)'; then
                              bot=true; backend=true; frontend=true
                          fi
                          echo "$CHANGED" | grep -qE '^packages/bot/' && bot=true
                          echo "$CHANGED" | grep -qE '^packages/backend/' && backend=true
                          echo "$CHANGED" | grep -qE '^(packages/frontend/|CHANGELOG\.md$|nginx/frontend\.conf$)' && frontend=true
                          echo "$CHANGED" | grep -qE '^(nginx/nginx\.conf$|nginx/upstream-active\.conf$|Dockerfile\.nginx$)' && nginx=true
                          echo "$CHANGED" | grep -qE '^packages/render/' && render=true
                      fi
                  else
                      bot=true; backend=true; frontend=true; nginx=true; render=true
                  fi

                  {
                      echo "code=$code"
                      echo "bot=$bot"
                      echo "backend=$backend"
                      echo "frontend=$frontend"
                      echo "nginx=$nginx"
                      echo "render=$render"
                  } >> "$GITHUB_OUTPUT"

                  FULL_MATRIX='[{"service":"bot","file":"Dockerfile","target":"production-bot"},{"service":"backend","file":"Dockerfile","target":"production-backend"},{"service":"frontend","file":"Dockerfile","target":"production-frontend"},{"service":"nginx","file":"Dockerfile.nginx","target":""},{"service":"render","file":"packages/render/Dockerfile","target":"","context":"packages/render"}]'
                  SERVICES=$(echo "$FULL_MATRIX" | jq -c \
                      --argjson bot "$bot" --argjson backend "$backend" \
                      --argjson frontend "$frontend" --argjson nginx "$nginx" \
                      --argjson render "$render" '
                      [ .[] | select(
                          (.service == "bot" and $bot) or
                          (.service == "backend" and $backend) or
                          (.service == "frontend" and $frontend) or
                          (.service == "nginx" and $nginx) or
                          (.service == "render" and $render)
                      ) ]')
                  echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
                  echo "Resolved: code=$code bot=$bot backend=$backend frontend=$frontend nginx=$nginx render=$render services=$SERVICES"

    # lucky-render (packages/render) is a standalone Rust crate: its own
    # toolchain pin, fmt/clippy/test/deny gates, no npm or build-shared deps.
    # Runs when `changes` says render changed (always on push, and on any
    # ci.yml / docker-build-service / .dockerignore change). Skipped otherwise,
    # which quality-gate accepts only when render did not change.
    rust:
        name: Rust — render
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: changes
        if: needs.changes.outputs.render == 'true'
        defaults:
            run:
                working-directory: packages/render
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            # Toolchain and components (rustfmt, clippy) come from
            # packages/render/rust-toolchain.toml, the single pin.
            # The Dockerfile compiler and the CI toolchain must not drift.
            - name: Check toolchain matches Dockerfile
              run: |
                  toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
                  image=$(sed -n 's/^# rust:\(.*\)-alpine.*/\1/p' Dockerfile)
                  if [ -z "$toolchain" ] || [ "$toolchain" != "$image" ]; then
                      echo "rust-toolchain.toml channel='$toolchain' vs Dockerfile rust:<ver>-alpine='$image'"
                      exit 1
                  fi
            - name: Install pinned toolchain
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: packages/render
            - name: Fetch fonts
              run: ./scripts/fetch-fonts.sh fonts
            - name: cargo fmt
              run: cargo fmt --check
            - name: cargo clippy
              run: cargo clippy --all-targets -- -D warnings
            - name: cargo test
              run: cargo test
            - name: cargo deny (bans licenses sources)
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  manifest-path: packages/render/Cargo.toml
                  command-arguments: bans licenses sources
            # RustSec advisories, up to 3 attempts: a network outage passes on a
            # retry, while a real advisory finding fails every attempt and so
            # fails the job. (cargo-deny 0.20 has no fetch-then-offline split
            # that works in the action's container.)
            - name: cargo deny advisories (attempt 1)
              id: deny-adv-1
              continue-on-error: true
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  manifest-path: packages/render/Cargo.toml
                  command-arguments: advisories
            - name: cargo deny advisories (attempt 2)
              id: deny-adv-2
              if: steps.deny-adv-1.outcome == 'failure'
              continue-on-error: true
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  manifest-path: packages/render/Cargo.toml
                  command-arguments: advisories
            - name: cargo deny advisories (attempt 3)
              if: steps.deny-adv-1.outcome == 'failure' && steps.deny-adv-2.outcome == 'failure'
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  manifest-path: packages/render/Cargo.toml
                  command-arguments: advisories

    docker-build:
        name: Build — ${{ matrix.service }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: changes
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.services != '[]'
        concurrency:
            # Must include matrix.service: a shared group makes the matrix legs
            # cancel each other instead of cancelling superseded runs.
            group: docker-build-${{ github.ref }}-${{ matrix.service }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.changes.outputs.services) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - name: Build ${{ matrix.service }}
              id: build
              uses: ./.github/actions/docker-build-service
              continue-on-error: true
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  context: ${{ matrix.context || '.' }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' || matrix.service == 'render' }}
            # Retry on transient failure (buildx setup and build re-run
            # together, matching the previous separate retry steps). Root
            # cause (see issue #2015): a local BuildKit race resolving a
            # COPY --from=<stage> reference — "failed to calculate checksum
            # of ref ...: not found" — while that shared stage
            # (installed-deps) is concurrently extended by a second live
            # branch in the same build DAG. Confirmed NOT a gha-cache issue:
            # reproduces 6/6 with cache-from AND cache-to fully disabled
            # (#2013, #2002). use-cache: 'false' is kept on retries anyway
            # (harmless, avoids any residual cache-side variable) but the
            # real mitigation here is attempt count — it's a race, not
            # deterministic, so more attempts raise the odds one lands
            # clean. Four retries (five attempts total) until #2015's
            # Dockerfile restructure removes the race itself.
            - name: Build ${{ matrix.service }} - retry 1 on transient failure
              id: build-retry-1
              if: steps.build.outcome == 'failure'
              continue-on-error: true
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  context: ${{ matrix.context || '.' }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' || matrix.service == 'render' }}
                  use-cache: 'false'
            - name: Build ${{ matrix.service }} - retry 2 on transient failure
              id: build-retry-2
              if: steps.build.outcome == 'failure' && steps.build-retry-1.outcome == 'failure'
              continue-on-error: true
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  context: ${{ matrix.context || '.' }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' || matrix.service == 'render' }}
                  use-cache: 'false'
            - name: Build ${{ matrix.service }} - retry 3 on transient failure
              id: build-retry-3
              if: steps.build.outcome == 'failure' && steps.build-retry-1.outcome == 'failure' && steps.build-retry-2.outcome == 'failure'
              continue-on-error: true
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  context: ${{ matrix.context || '.' }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' || matrix.service == 'render' }}
                  use-cache: 'false'
            - name: Build ${{ matrix.service }} - retry 4 on transient failure
              if: steps.build.outcome == 'failure' && steps.build-retry-1.outcome == 'failure' && steps.build-retry-2.outcome == 'failure' && steps.build-retry-3.outcome == 'failure'
              uses: ./.github/actions/docker-build-service
              with:
                  service: ${{ matrix.service }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  context: ${{ matrix.context || '.' }}
                  load: ${{ matrix.service == 'bot' || matrix.service == 'nginx' || matrix.service == 'render' }}
                  use-cache: 'false'
            # A built image is not a working image: the bot's native addons
            # (mediaplex, the opus encoder @discord-player/opus loads first) and
            # the baked Prisma engines only fail at require()-time, which
            # `docker build` never reaches. #1735 shipped a
            # Prisma engine that crash-looped 262x behind a green build. Load the
            # real production-bot image and require the modules for real.
            - name: Verify native modules load — bot
              if: matrix.service == 'bot'
              run: |
                  docker run --rm lucky-bot:ci node -e "
                    const { OpusEncoder } = require('mediaplex');
                    const frame = new OpusEncoder(48000, 2).encode(Buffer.alloc(3840));
                    if (!frame.length) throw new Error('opus encoded an empty frame');
                    console.log('opus OK — encoded', frame.length, 'bytes');
                  "
                  # #2664: yt-dlp needs the EJS solver scripts in its venv, at
                  # the exact version it pins (any other version is ignored).
                  docker run --rm lucky-bot:ci /opt/ytdlp/bin/python -c "
                  import re, importlib.metadata as m, yt_dlp_ejs
                  pin = next(r for r in m.requires('yt-dlp') if r.startswith('yt-dlp-ejs'))
                  want = re.search(r'==([^;\s]+)', pin).group(1)
                  got = m.version('yt-dlp-ejs')
                  print('yt-dlp', m.version('yt-dlp'), 'yt-dlp-ejs', got, 'pinned', want)
                  assert got == want, 'yt-dlp-ejs version does not match the yt-dlp pin'
                  "
            # ESM load-time bugs (bare JSON imports, a missing file extension
            # add-js-extensions.js failed to patch, a circular import) pass every
            # other check and only surface when Node actually loads the built
            # module — jest transpiles to CJS (where these are legal), tsc emits
            # the import verbatim, and `npm run build` never runs what it
            # produced. v2.40.0 shipped exactly this (a bare JSON import) and
            # crash-looped in production behind 3,203 passing tests (#2113,
            # #2115). Both modules below are confirmed side-effect-free at
            # import time (no top-level I/O) — verified by hand, since a
            # handlers/player candidate was tried and dropped: its import graph
            # transitively reaches a shared service that throws immediately if
            # DATABASE_URL isn't set (filed as #2258), which is exactly the
            # "constraint is picking modules that are safe to import" #2115
            # itself calls out. Widening this list needs the same care.
            - name: Verify ESM boot safety — bot
              if: matrix.service == 'bot'
              run: |
                  docker run --rm lucky-bot:ci node -e "
                    Promise.all([
                      import('./packages/bot/dist/i18n/index.js'),
                      import('./packages/bot/dist/utils/music/duplicateDetection/types.js'),
                    ]).then(() => console.log('ESM boot smoke OK')).catch((err) => {
                      console.error('ESM boot smoke FAILED:', err);
                      process.exit(1);
                    })
                  "
            # Include files are the #1908/#1910 rollback class: a missing or
            # http-level-loaded include crashes nginx at boot, which
            # `docker build` never reaches. Gate per
            # decisions/2026-07-11-bluegreen-web-tier.md: `nginx -t` in the
            # real image must pass before merge.
            - name: Validate nginx config — nginx
              if: matrix.service == 'nginx'
              run: docker run --rm lucky-nginx:ci nginx -t
            # A built image is not a working image: run the real render image
            # under the production limits, wait for its own healthcheck, then
            # render one fixture and assert a JPEG comes back.
            - name: Smoke test render
              if: matrix.service == 'render'
              run: |
                  c=lucky-render-smoke
                  trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
                  docker run -d --name "$c" --cpus 0.5 --memory 128m \
                      --read-only --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 64 \
                      -p 127.0.0.1:18080:8080 lucky-render:ci
                  ok=false
                  for _ in $(seq 1 30); do
                      if docker exec "$c" /usr/local/bin/lucky-render healthcheck; then ok=true; break; fi
                      sleep 1
                  done
                  if [ "$ok" != true ]; then
                      echo "healthcheck never passed"; docker logs "$c"; exit 1
                  fi
                  code=$(curl -sS -o render.jpg -w '%{http_code}' -X POST \
                      -H 'Content-Type: application/json' \
                      --data-binary @packages/render/tests/fixtures/grid1.json \
                      http://127.0.0.1:18080/render/recap) || { docker logs "$c"; exit 1; }
                  magic=$(head -c 3 render.jpg | xxd -p)
                  if [ "$code" != 200 ] || [ "$magic" != ffd8ff ]; then
                      echo "render smoke failed: http=$code magic=$magic"; docker logs "$c"; exit 1
                  fi
                  echo "render smoke OK: http=$code magic=$magic"

    docker-build-check:
        name: Build — Docker images
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [changes, docker-build]
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        steps:
            - name: Assert all builds passed
              run: |
                  if [[ "${{ needs.changes.result }}" != "success" ]]; then
                      echo "changes job did not complete successfully: ${{ needs.changes.result }}"
                      exit 1
                  fi
                  if [[ "${{ needs.changes.outputs.services }}" == "[]" ]]; then
                      echo "No Docker-relevant changes in this diff — skipping validation."
                      exit 0
                  fi
                  if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
                      echo "Docker build result: ${{ needs.docker-build.result }}"
                      exit 1
                  fi

    quality-gate:
        # test-youtube-smoke intentionally excluded: advisory-only, runs on YouTube dependency PRs only
        name: Quality Gates
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [changes, build-shared, checks, test-shared, test-backend, test-bot, test-frontend, rust]
        if: always()
        steps:
            - name: Assert all jobs passed
              run: |
                  # `changes` failing outright must never read as a pass:
                  # build-shared/checks/test-* all have an implicit success()
                  # in their `if`, so a failed `changes` (or a failed
                  # build-shared) cascades into SKIPPED results below, and
                  # skipped used to read as passing unconditionally. Check
                  # `changes` first and hard fail here rather than let that
                  # cascade through.
                  if [[ "${{ needs.changes.result }}" != "success" ]]; then
                      echo "changes job did not complete successfully: ${{ needs.changes.result }}"
                      exit 1
                  fi

                  shared_build="${{ needs.build-shared.result }}"
                  checks="${{ needs.checks.result }}"
                  shared="${{ needs.test-shared.result }}"
                  backend="${{ needs.test-backend.result }}"
                  bot="${{ needs.test-bot.result }}"
                  frontend="${{ needs.test-frontend.result }}"

                  # `skipped` is only a legitimate pass when `changes` itself
                  # deliberately gated the chain off for a docs-only PR
                  # (code == 'false'). On push/merge_group, or any PR where
                  # code == 'true', a `skipped` result here means build-shared
                  # (or something upstream of it) actually FAILED and cascaded
                  # a skip rather than nothing needing to run, and that must
                  # fail this required check, not pass it.
                  docs_only_skip_ok=false
                  if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.changes.outputs.code }}" != "true" ]]; then
                      docs_only_skip_ok=true
                  fi

                  # rust is gated on `render`, not `code`: skipped is a pass
                  # only when render did not change (docs-only PRs included).
                  # If render changed and the job was skipped, upstream broke.
                  rust="${{ needs.rust.result }}"
                  if [[ "$rust" != "success" ]]; then
                      if [[ "$rust" != "skipped" || "${{ needs.changes.outputs.render }}" == "true" ]]; then
                          echo "Job results: rust=$rust (render changed=${{ needs.changes.outputs.render }})"
                          exit 1
                      fi
                  fi

                  for r in "$shared_build" "$checks" "$shared" "$backend" "$bot" "$frontend"; do
                      if [[ "$r" == "success" ]]; then
                          continue
                      fi
                      if [[ "$r" == "skipped" && "$docs_only_skip_ok" == "true" ]]; then
                          continue
                      fi
                      echo "Job results: build-shared=$shared_build  checks=$checks  test-shared=$shared  test-backend=$backend  test-bot=$bot  test-frontend=$frontend  (docs_only_skip_ok=$docs_only_skip_ok)"
                      exit 1
                  done

    sonar:
        name: SonarCloud Scan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [changes, test-backend, test-bot, test-frontend]
        # Fork PRs get no secrets, so SONAR_TOKEN is never present and the
        # token policy step would hard-fail this required check. Skip the job
        # there instead; a skipped required check counts as passing. Same for
        # docs-only PRs: test-backend/test-bot/test-frontend are gated off by
        # `changes`, so there's no coverage to scan. If `changes` itself
        # fails, this job's implicit success() also makes it skip rather
        # than fail -- merge stays blocked anyway because quality-gate
        # independently checks `changes`'s result and hard-fails "Quality
        # Gates" in that case.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true')
        permissions:
            contents: read
            pull-requests: read
        env:
            SONAR_TOKEN_PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: coverage-backend
                  path: packages/backend/coverage
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: coverage-bot
                  path: packages/bot/coverage
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: coverage-frontend
                  path: packages/frontend/coverage
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: '17'
            - name: Validate Sonar token policy
              if: env.SONAR_TOKEN_PRESENT != 'true' && github.actor != 'dependabot[bot]'
              run: |
                  echo "::error::SONAR_TOKEN is required for non-Dependabot runs."
                  exit 1
            - name: Skip Sonar scan for Dependabot without token
              if: env.SONAR_TOKEN_PRESENT != 'true' && github.actor == 'dependabot[bot]'
              run: echo "Skipping SonarCloud scan — no token for Dependabot."
            # First attempt is allowed to fail: the scanner-engine download from
            # scanner.sonarcloud.io intermittently 403s (transient CDN/provisioning),
            # which otherwise fails this required check and blocks merge on a flake.
            - name: SonarCloud Scan (PR — quality gate blocks merge)
              id: sonar_pr
              if: env.SONAR_TOKEN_PRESENT == 'true' && github.event_name == 'pull_request'
              continue-on-error: true
              uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
              with:
                  args: -Dsonar.qualitygate.wait=true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            # Retry once only when the first attempt failed. A real quality-gate
            # failure fails both attempts (so merge stays blocked); a transient
            # download 403 clears on the retry.
            - name: SonarCloud Scan (PR) — retry once on transient failure
              if: env.SONAR_TOKEN_PRESENT == 'true' && github.event_name == 'pull_request' && steps.sonar_pr.outcome == 'failure'
              uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
              with:
                  args: -Dsonar.qualitygate.wait=true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            # Push-to-main scan is informational only — its failure must never fail
            # the job (and thereby block the build→deploy chain). continue-on-error
            # makes "non-blocking" actually true.
            - name: SonarCloud Scan (main — informational, non-blocking)
              if: env.SONAR_TOKEN_PRESENT == 'true' && github.event_name == 'push'
              continue-on-error: true
              uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
              with:
                  args: -Dsonar.qualitygate.wait=false
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    security:
        name: Security
        runs-on: ubuntu-latest
        timeout-minutes: 25
        concurrency:
            group: ${{ github.workflow }}-security-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - name: Security audit
              run: npm run audit:high
            - name: Secrets scan
              run: npx secretlint "**/*"
