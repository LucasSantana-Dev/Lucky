name: Deploy Frontend to Cloudflare Pages

# Ships with the release, after the homelab deploy (deploy.yml) succeeds, so a
# batch of merged PRs reaches production as one deploy and the UI never goes
# live ahead of the API it calls. See decisions/2026-10-01-batched-releases.md.
# Only release-triggered homelab deploys count: a rollback dispatch of
# deploy.yml must not push main's unreleased frontend. For an out-of-band
# frontend hotfix, run workflow_dispatch from the hotfix tag, not from main.
on:
  workflow_run:
    workflows: ['Deploy to Homelab']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-cf
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # On workflow_run, github.sha is main's HEAD, not the release commit.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # This is a root-lockfile monorepo (workspaces: packages/*). Per-package
      # lockfiles are gitignored (.gitignore: packages/*/package-lock.json), so
      # `npm ci` and the setup-node cache MUST target the root package-lock.json.
      # The old config pointed both at packages/frontend/package-lock.json, which
      # does not exist in CI — every run died at the cache step in ~8s and the
      # live site froze on a pre-workflow build. Mirror the Dockerfile `build` +
      # `build-frontend` stages: root install → prisma generate → build:shared →
      # frontend build (which imports @lucky/shared and repo-root CHANGELOG.md).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build shared package
        run: npm run build:shared

      - name: Build frontend
        run: npm run build --workspace=packages/frontend
        env:
          VITE_API_BASE_URL: https://lucky-api.lucassantana.tech/api
          VITE_SENTRY_ENVIRONMENT: production
          VITE_COMMIT_SHA: ${{ env.DEPLOY_SHA }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 712118840109d834d5e99925fd172432
          command: pages deploy packages/frontend/dist --project-name lucky-webapp --branch main
