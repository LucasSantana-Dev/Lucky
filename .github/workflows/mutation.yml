name: Mutation Testing

# Runs Stryker mutation testing on the shared and backend packages (#1426). Unlike
# line coverage, mutation testing verifies that tests actually CATCH bugs. The
# `thresholds.break` in each package's stryker.conf.json fails the job if the
# score regresses, so weakened assertions can't land silently.
#
# Scope is the gated shared modules listed in stryker.conf.json `mutate`. The run
# uses Stryker incremental mode (#1438): the incremental cache is restored/saved
# across runs so unchanged modules are skipped and only changed files re-mutate.
# This is NOT a required status check yet; promote it in branch protection once
# the score has stabilised, and widen `mutate` to more modules over time.
#
# The three near-identical per-package jobs were converted into a single matrix
# job over shared/backend/bot (fail-fast: false, per-package cache keys and
# artifact names preserved).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'release/**'
    paths:
      - 'packages/shared/**'
      - 'packages/backend/**'
      - 'packages/bot/**'
      - '.github/workflows/mutation.yml'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        package: [shared, backend, bot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build shared package
        run: npm run build:shared
      - name: Restore Stryker incremental cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/${{ matrix.package }}/reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ matrix.package }}-
      - name: Run mutation tests (${{ matrix.package }})
        run: npm run test:mutation --workspace=packages/${{ matrix.package }}
        env:
          # Specs import code that reads Prisma env at module load; the client is
          # mocked in tests but the dummy URL keeps parity with the other CI jobs
          # and avoids a load-time failure.
          DATABASE_URL: postgresql://localhost:5432/test
      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/mutation
          retention-days: 7
