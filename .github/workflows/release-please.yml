name: Release Please

# Automates the release step (ADR 2026-06-16): on every push to main,
# release-please maintains a single open release PR that pre-computes the next
# semver bump + CHANGELOG from conventional commits. Merging that PR tags v*
# and publishes a GitHub Release, whose `release: published` event triggers
# deploy.yml (unchanged 30-min bake → homelab webhook → migrations → rollback).
# No auto-merge on push. Since decisions/2026-10-01-batched-releases.md the
# release PR is merged by the owner or by the owner-authorized batch loop under
# that ADR's release gate, so merged PRs reach prod in batches. deploy-frontend-cf.yml
# follows a successful release deploy. Incident hotfixes still use the
# workflow_dispatch fast-path.

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        name: Maintain release PR
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  # Must be a PAT (or GitHub App token), NOT the default
                  # GITHUB_TOKEN. GitHub Actions deliberately does not let events
                  # raised by GITHUB_TOKEN (e.g. the `release: published` event
                  # emitted when release-please publishes the GitHub Release)
                  # trigger further workflow runs — recursion prevention. With
                  # GITHUB_TOKEN the tag/Release is created but deploy.yml
                  # (`on: release: [published]`) would never fire, silently
                  # breaking the prod deploy chain. A PAT makes the published
                  # Release propagate so deploy.yml runs. The PAT also lets the
                  # release PR be created without the "Allow Actions to create
                  # PRs" repo setting. Scope: contents RW + pull-requests RW.
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            # release-please rewrites package.json and package-lock.json from the
            # snapshot it held when it opened the release PR. When main later
            # changes dependencies in a commit that does not alter the release
            # notes (a chore), the PR branch keeps the old dependency set, so
            # merging it would revert those bumps and break `npm ci` (#2539).
            # Fail loudly instead of leaving a silently stale PR.
            - name: Guard release PR against a stale dependency snapshot
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  branch=release-please--branches--main
                  pr=$(gh pr list --repo "$REPO" --head "$branch" --state open                     --json number --jq '.[0].number // empty')
                  if [ -z "$pr" ]; then
                    echo "No open release PR, nothing to check."
                    exit 0
                  fi
                  fetch() {
                    gh api "repos/$REPO/contents/$1?ref=$2"                       -H "Accept: application/vnd.github.raw+json"
                  }
                  # Compare everything except the version bump release-please owns.
                  pkg='del(.version)'
                  lock='del(.version) | del(.packages[""].version)'
                  stale=0
                  for spec in "package.json:$pkg" "package-lock.json:$lock"; do
                    file=${spec%%:*}
                    filter=${spec#*:}
                    a=$(fetch "$file" main | jq -S "$filter")
                    b=$(fetch "$file" "$branch" | jq -S "$filter")
                    if [ "$a" != "$b" ]; then
                      echo "::error file=$file::Release PR #$pr has a stale $file (differs from main beyond the version). Merging it would revert dependency changes. Refresh the release PR."
                      stale=1
                    fi
                  done
                  exit "$stale"
