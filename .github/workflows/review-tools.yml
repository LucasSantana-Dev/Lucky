name: Review Tools

# Calls the org-level reusable workflows in LucasSantana-Dev/.github
# (single source of truth for the Claude review prompt + Danger runtime).
#
# Tag policy: pinned to the mutable `@v1` tag intentionally. We accept the
# trade-off — automatic adoption of non-breaking central updates is the
# reason these workflows are centralized at all. Breaking changes ship under
# a new major (`@v2`); consumers bump explicitly.
# If a downstream repo needs strict immutability, pin to a commit SHA
# instead of `@v1`.
#
# Repo-specific behavior lives in:
#   - dangerfile.ts (rules)
#   - cubic dashboard (AI review custom rules — see docs/review-tools.md)

on:
  # pull_request_target so danger can comment on fork PRs (fork pull_request
  # tokens are forced read-only, so the comment POST 403s and fails the job).
  # The reusable workflow checks out and executes BASE repo code only; never
  # add a step here that checks out or runs PR head code.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'package-lock.json'

# Cancel superseded runs when a newer commit is pushed to the same PR.
concurrency:
  group: review-tools-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimum permissions for the reusable workflows called below. An explicit
# block sets every unlisted scope to `none`, and a called reusable workflow
# cannot request scopes the caller withheld — so the caller must grant the
# UNION of what the reusables declare, or the run fails at startup (see #1423):
#   - danger.yml needs contents:read, pull-requests:write, issues:write
#
# id-token:write was here for claude-review's OIDC. That job is gone, and so is
# kimi-review, so nothing left needs it.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # claude-review removed: the upstream action crashes on every PR (#1836) and
  # `continue-on-error` is not valid on reusable-workflow jobs (actionlint).
  #
  # kimi-review removed too (#1877): KIMI_API_KEY was never set, so the job
  # failed on every PR in the repo with "KIMI_API_KEY secret is empty" and made
  # the check list permanently red. Gating it on the secret is not an option
  # here — the `secrets` context is not available in a job-level `if`, and
  # `continue-on-error` is invalid on reusable-workflow jobs, same as above.
  # To re-enable: set the KIMI_API_KEY repo secret and restore the job.
  #
  # AI review is currently covered by cubic and CodeRabbit, which run as apps
  # rather than workflow jobs.
  danger:
    uses: LucasSantana-Dev/.github/.github/workflows/danger.yml@ad6776a59b88a798b145e7b555368c39799e23e7 # v1
