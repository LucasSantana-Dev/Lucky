name: PR Agent

# pull_request_target so fork PRs receive AI review (fork pull_request runs get
# no secrets). NEVER add a checkout step or any step that executes PR code in
# this workflow; PR-Agent reads the diff via the GitHub API only.
on:
    pull_request_target:
        types: [opened, reopened, ready_for_review]
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

concurrency:
    # Under pull_request_target github.ref is the base branch, so key on the PR
    # number to avoid serializing reviews across unrelated PRs.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    pr-agent:
        name: AI Code Review
        runs-on: ubuntu-latest
        if: ${{ github.event.sender.type != 'Bot' && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) }}
        permissions:
            issues: write
            pull-requests: write
            contents: read
        steps:
            - name: PR Agent action
              uses: Codium-ai/pr-agent@570f67ed5fc8db5be74c18df070bc20079b64b0d  # main
              env:
                  OPENAI.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  OPENAI.API_TYPE: anthropic
                  OPENAI.MODEL: claude-sonnet-4-6
                  CONFIG.AI_PROVIDER: anthropic
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  github_action_config.auto_review: 'true'
                  github_action_config.auto_describe: 'true'
                  github_action_config.auto_improve: 'true'
