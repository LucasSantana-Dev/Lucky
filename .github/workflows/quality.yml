name: Quality Gates

on:
    push:
        branches: ['release/**', main]
    pull_request:
        branches: ['release/**', main]

jobs:
    quality:
        uses: LucasSantana-Dev/.github/.github/workflows/quality.yml@ad6776a59b88a798b145e7b555368c39799e23e7
        with:
            node-version: '24'
            has-dockerfile: true
            run-deadcode: true
            package-manager: npm
            pre-lint-script: 'npm run db:generate && npm run build:shared'
            # ci.yml's checks job already lints all four workspaces.
            lint-script: ''
        permissions:
            contents: read
            security-events: write
            actions: read
