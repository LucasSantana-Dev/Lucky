# Shared resource defaults — applied per service via `<<: *small-svc` etc.
x-small-svc: &small-svc
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

x-medium-svc: &medium-svc
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

x-large-svc: &large-svc
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

# Environment shared by bot + backend. Both apps connect to the same
# postgres, redis, Discord auth pair, Sentry org, and integrations
# (last.fm + spotify). Service-specific vars stay inline in each
# service's `environment:` block.
x-common-app-env: &common-app-env
    NODE_ENV: production
    DISCORD_TOKEN: ${DISCORD_TOKEN}
    CLIENT_ID: ${CLIENT_ID}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENABLED: ${SENTRY_ENABLED:-true}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    SENTRY_SERVER_NAME: ${SENTRY_SERVER_NAME:-}
    SENTRY_APP_NAME: ${SENTRY_APP_NAME:-lucky}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-}
    DATABASE_URL: postgresql://discordbot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@postgres:5432/discordbot
    # The Prisma CLI (migrate deploy on startup) reads DIRECT_URL, not
    # DATABASE_URL. Without this override it falls back to the .env value,
    # which points at localhost and is unreachable from inside the container.
    DIRECT_URL: postgresql://discordbot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@postgres:5432/discordbot
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: ${REDIS_DB:-0}
    LASTFM_API_KEY: ${LASTFM_API_KEY:-}
    LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
    LASTFM_LINK_SECRET: ${LASTFM_LINK_SECRET:-}
    SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
    SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
    SPOTIFY_LINK_SECRET: ${SPOTIFY_LINK_SECRET:-}
    WEBAPP_REDIRECT_URI: ${WEBAPP_REDIRECT_URI:-}
    WEBAPP_SESSION_SECRET: ${WEBAPP_SESSION_SECRET:-}
services:
    postgres:
        <<: *large-svc
        image: postgres:18-alpine
        container_name: lucky-postgres
        environment:
            POSTGRES_DB: discordbot
            POSTGRES_USER: discordbot
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
            PGDATA: /var/lib/postgresql/data
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - lucky-network
            # Read-only Grafana access (role grafana_ro, see
            # observability/postgres/grafana-ro.sql). Only postgres joins it.
            - lucky-db-ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U discordbot -d discordbot"]
            interval: 30s
            timeout: 10s
            retries: 3
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    redis:
        <<: *medium-svc
        image: redis:8-alpine
        container_name: lucky-redis
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        networks:
            - lucky-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    bot:
        <<: *large-svc
        image: ${IMAGE_PREFIX:-ghcr.io/lucassantana-dev/lucky}-bot:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile
            target: production-bot
            args:
                SERVICE: bot
                NODE_ENV: production
        container_name: lucky-bot
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            <<: *common-app-env
            SENTRY_SERVICE_NAME: ${SENTRY_SERVICE_NAME:-bot}
            BOT_NAME: ${BOT_NAME:-Lucky}
            # On-box + off-box dead-man ping targets (ADR 2026-09-26 / #2390).
            # One heartbeat implementation (packages/shared/src/utils/
            # monitoring/heartbeat.ts) reads the same var names in every
            # process, but each service maps from its OWN source var
            # (HEARTBEAT_PING_URL_BOT / _BACKEND) so a URL-keyed external
            # monitor (e.g. healthchecks.io) can tell bot and backend apart;
            # sharing one URL would let the backend's unconditional pings
            # mask a dead/zombie bot forever. Falls back to the generic
            # HEARTBEAT_PING_URL(_EXTERNAL) when the per-service var is
            # unset, so a deployment that has not migrated to the
            # per-service vars yet keeps its heartbeat instead of getting
            # an empty string here that would shadow the generic value.
            HEARTBEAT_PING_URL: ${HEARTBEAT_PING_URL_BOT:-${HEARTBEAT_PING_URL:-}}
            HEARTBEAT_PING_URL_EXTERNAL: ${HEARTBEAT_PING_URL_BOT_EXTERNAL:-${HEARTBEAT_PING_URL_EXTERNAL:-}}
            HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-}
            LASTFM_SESSION_KEY: ${LASTFM_SESSION_KEY:-}
            PLAYER_CONNECTION_TIMEOUT: ${PLAYER_CONNECTION_TIMEOUT:-15000}
            MUSIC_WATCHDOG_RECOVERY_WAIT_MS: ${MUSIC_WATCHDOG_RECOVERY_WAIT_MS:-5000}
            TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
            TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
            TWITCH_ACCESS_TOKEN: ${TWITCH_ACCESS_TOKEN:-}
            TWITCH_REFRESH_TOKEN: ${TWITCH_REFRESH_TOKEN:-}
            AI_DEV_TOOLKIT_BOARD_ENABLED: ${AI_DEV_TOOLKIT_BOARD_ENABLED:-false}
            AI_DEV_TOOLKIT_CHANNEL_ID: ${AI_DEV_TOOLKIT_CHANNEL_ID:-}
            GITHUB_TOKEN: ${GITHUB_TOKEN:-}
            # ADR 2026-06-18: yt-dlp cookies to dodge YouTube's 403 bot
            # detection. Drop a Netscape-format cookies.txt at
            # ./secrets/youtube-cookies.txt on the host; no-ops if absent.
            YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-/app/secrets/youtube-cookies.txt}
        volumes:
            - ./downloads:/app/downloads
            - ./logs:/app/logs
            # Directory mount (not single-file): a single-file bind-mount to a
            # host path that doesn't exist yet gets autocreated as a directory
            # by Docker, breaking the container. See the `webhook` service's
            # hooks.json comment for the same footgun.
            # Read-write (not :ro): yt-dlp's --cookies both reads AND dumps
            # the refreshed cookie jar back to this file every run; read-only
            # silently breaks that refresh (confirmed via local repro) and
            # shortens the cookies' effective lifetime for no benefit.
            # Whole directory, not just the cookies file: a single-file
            # rw bind to a host path that doesn't exist yet hits the same
            # autocreate-as-directory footgun noted above, which would break
            # on first boot before the operator has created the file. This
            # directory is single-purpose (just the cookies file + a README
            # excluded from the write concern by not being read by yt-dlp),
            # so the broader write scope has no real blast radius today.
            - ./secrets:/app/secrets
        networks:
            - lucky-network
            # Shared monitoring network so the homelab Prometheus
            # container can scrape /metrics on port 9091 without
            # exposing it on the host. See homelab PR #135.
            - lucky-monitoring
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    backend:
        <<: *medium-svc
        image: ${IMAGE_PREFIX:-ghcr.io/lucassantana-dev/lucky}-backend:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile
            target: production-backend
            args:
                SERVICE: backend
                NODE_ENV: production
        container_name: lucky-backend
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            <<: *common-app-env
            SENTRY_SERVICE_NAME: ${SENTRY_SERVICE_NAME:-backend}
            # Same heartbeat contract as bot (ADR 2026-09-26 / #2390): the
            # backend has no "ready" gate, so it pings unconditionally. Its
            # own source vars (HEARTBEAT_PING_URL_BACKEND / _EXTERNAL) keep
            # it distinguishable from the bot on a URL-keyed monitor, with
            # the same generic HEARTBEAT_PING_URL(_EXTERNAL) fallback as
            # the bot above for a deployment not yet migrated.
            HEARTBEAT_PING_URL: ${HEARTBEAT_PING_URL_BACKEND:-${HEARTBEAT_PING_URL:-}}
            HEARTBEAT_PING_URL_EXTERNAL: ${HEARTBEAT_PING_URL_BACKEND_EXTERNAL:-${HEARTBEAT_PING_URL_EXTERNAL:-}}
            HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-}
            LUCKY_NOTIFY_API_KEY: ${LUCKY_NOTIFY_API_KEY:-}
            CLIENT_SECRET: ${CLIENT_SECRET}
            WEBAPP_PORT: 3000
            DEVELOPER_USER_IDS: ${DEVELOPER_USER_IDS:-}
            WEBAPP_FRONTEND_URL: ${WEBAPP_FRONTEND_URL:-}
            WEBAPP_BACKEND_URL: ${WEBAPP_BACKEND_URL:-}
        networks:
            - lucky-network
            # Shared monitoring network so the homelab Prometheus
            # container can scrape /metrics on the backend without
            # exposing it on the host. See homelab PR #135.
            - lucky-monitoring
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    frontend:
        <<: *small-svc
        image: ${IMAGE_PREFIX:-ghcr.io/lucassantana-dev/lucky}-frontend:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile
            target: production-frontend
        container_name: lucky-frontend
        networks:
            - lucky-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    nginx:
        <<: *small-svc
        image: ${IMAGE_PREFIX:-ghcr.io/lucassantana-dev/lucky}-nginx:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile.nginx
        container_name: lucky-nginx
        depends_on:
            - backend
            - frontend
        ports:
            # Container now listens on 8080 (non-root nginx).
            # NOTE: update cloudflared config-lucky.yml service entry to
            # `http://nginx:8080` after deploying this change.
            - "${NGINX_PORT:-8080}:8080"
        networks:
            - lucky-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    # lucky-render: standalone Rust sidecar (packages/render). Own build
    # context (not repo root) and no depends_on to or from the bot; it only
    # joins lucky-network and publishes no ports. 128m/0.5 matches neither
    # x-small-svc nor x-medium-svc, so limits are explicit.
    render:
        image: ${IMAGE_PREFIX:-ghcr.io/lucassantana-dev/lucky}-render:${IMAGE_TAG:-latest}
        build:
            context: ./packages/render
            dockerfile: Dockerfile
        container_name: lucky-render
        # SIGTERM: up to 15 s for in-flight requests, then a 10 s render drain.
        stop_grace_period: 30s
        mem_limit: 128m
        cpus: 0.5
        restart: unless-stopped
        # Hardening: the binary needs no writable fs (fonts are read-only in
        # the image) and no capabilities.
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 64
        networks:
            - lucky-network
            # Lets the homelab Prometheus scrape /metrics (scrape job: #2694).
            - lucky-monitoring
        healthcheck:
            test: ["CMD", "/usr/local/bin/lucky-render", "healthcheck"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    webhook:
        <<: *small-svc
        build:
            context: ./deploy
            dockerfile: Dockerfile
        container_name: lucky-webhook
        command: >
            -hooks /home/luk-server/Lucky/deploy/hooks.json
            -verbose
            -hotreload
        environment:
            - DEPLOY_WEBHOOK_SECRET=${DEPLOY_WEBHOOK_SECRET}
            - DISCORD_DEPLOY_WEBHOOK=${DISCORD_DEPLOY_WEBHOOK:-}
            - DEPLOY_DIR=/home/luk-server/Lucky
            - GITHUB_DEPLOY_STATUS_TOKEN=${GITHUB_DEPLOY_STATUS_TOKEN:-}
        volumes:
            # Read hooks.json from the directory-mounted repo (not a single-file
            # mount): a single-file bind-mount freezes to the original inode, so
            # a deploy's `git reset` that REPLACES the file is never seen, leaving
            # the webhook on a stale hooks.json. The directory mount updates live,
            # so -hotreload picks up changes (e.g. new pass-arguments entries).
            - .:/home/luk-server/Lucky
            # Staging checkout, so the deploy-staging hook can build + run the
            # isolated lucky-staging stack from this same webhook container.
            - ${STAGING_DIR:-/home/luk-server/lucky-staging}:/home/luk-server/lucky-staging
            - ${CLOUDFLARED_CONFIG_DIR:-/home/luk-server/.cloudflared}:${CLOUDFLARED_CONFIG_DIR:-/home/luk-server/.cloudflared}:ro
            - /var/run/docker.sock:/var/run/docker.sock
        working_dir: /home/luk-server/Lucky
        networks:
            - lucky-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    # Cloudflare Tunnel — exposes nginx to lucky.lucassantana.tech
    cloudflared:
        <<: *small-svc
        image: cloudflare/cloudflared:2026.6.0
        container_name: lucky-tunnel
        command: tunnel --config /etc/cloudflared/config-lucky.yml run
        volumes:
            - ${CLOUDFLARED_CONFIG_DIR:-/home/luk-server/.cloudflared}:/etc/cloudflared:ro
        depends_on:
            - nginx
        networks:
            - lucky-network
        profiles:
            - tunnel
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    # Lucky-owned observability stack (ADR 2026-09-26, phase P2a).
    # `docker compose --profile observability up -d`. No service in this
    # group binds a host port; reach Grafana per observability/README.md.
    prometheus:
        <<: *medium-svc
        image: prom/prometheus:v3.9.0
        container_name: lucky-prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--storage.tsdb.retention.size=5GB"
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./observability/prometheus/rules:/etc/prometheus/rules:ro
            - prometheus_data:/prometheus
        networks:
            - lucky-network
        profiles:
            - observability
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    grafana:
        <<: *medium-svc
        mem_limit: 256m
        image: grafana/grafana:12.4.0
        container_name: lucky-grafana
        depends_on:
            - prometheus
        environment:
            # NOTE: not `:?` (required). Compose interpolates every service's
            # env references at parse time regardless of active profile, so a
            # required var here would break plain `docker compose up` even
            # when the observability profile is never requested. Empty
            # defaults push the failure to Grafana's own startup instead,
            # which only happens when this profile is actually used.
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
            # Grafana is dashboards-only: alert evaluation and notification
            # live in Prometheus + Alertmanager (single source of truth for
            # rules). No SMTP/contact-point env vars needed here anymore.
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/files/lucky-inicio.json
        volumes:
            - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
            - grafana_data:/var/lib/grafana
        networks:
            - lucky-network
            # Shared monitoring network so Grafana can reach the homelab's
            # Loki instance for the Loki panels of the lucky dashboards
            # datasource (see observability/grafana/provisioning/datasources/loki.yaml).
            # Same network bot/backend already join for the reverse
            # direction (homelab Prometheus scraping them). See homelab PR #135.
            - lucky-monitoring
        profiles:
            - observability
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    node-exporter:
        <<: *small-svc
        mem_limit: 64m
        image: prom/node-exporter:v1.10.0
        container_name: lucky-node-exporter
        command:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/host/root"
            - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/host/root:ro
        networks:
            - lucky-network
        profiles:
            - observability
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    cadvisor:
        <<: *small-svc
        image: gcr.io/cadvisor/cadvisor:v0.52.1
        container_name: lucky-cadvisor
        # Feeds the lucky-resource-pressure rule group (per-container memory
        # working-set / limit ratio) in observability/prometheus/rules/. Same
        # `name` label as the container_name values those rules match on
        # (lucky-bot, lucky-backend, ...).
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker:/var/lib/docker:ro
        networks:
            - lucky-network
        profiles:
            - observability
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

    # Renders observability/alertmanager/alertmanager.yml.tmpl into a shared
    # volume before alertmanager starts. Alertmanager's config format has no
    # native ${VAR} expansion, so the non-secret fields (SMTP host/port/from,
    # alert recipient address) are substituted here with envsubst (baked into
    # the image at build time via observability/alertmanager/Dockerfile, not
    # installed at every startup); the two secret fields (SMTP password,
    # Watchdog webhook URL) instead use Alertmanager's own `_file` config
    # options, fed by Compose `secrets:` sourced from env vars below, so no
    # secret ever lands in the rendered plain-text config. Runs once and
    # exits; alertmanager waits for it.
    #
    # IMPORTANT: Compose does not detect changes to a bind-mounted file, so
    # editing alertmanager.yml.tmpl does NOT get picked up by a plain
    # `docker compose up -d`. After changing the template, force both
    # containers to redo their work:
    #   docker compose --profile observability up -d --force-recreate \
    #     alertmanager-config alertmanager
    alertmanager-config:
        build:
            context: ./observability/alertmanager
            dockerfile: Dockerfile
        container_name: lucky-alertmanager-config
        restart: "no"
        command:
            - sh
            - -c
            - envsubst < /template/alertmanager.yml.tmpl > /rendered/alertmanager.yml
        environment:
            ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
        volumes:
            - ./observability/alertmanager:/template:ro
            - alertmanager_config:/rendered
        profiles:
            - observability

    alertmanager:
        <<: *small-svc
        image: prom/alertmanager:v0.28.1
        container_name: lucky-alertmanager
        depends_on:
            alertmanager-config:
                condition: service_completed_successfully
        command:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
        volumes:
            - alertmanager_config:/etc/alertmanager:ro
            - alertmanager_data:/alertmanager
        secrets:
            - smtp_password
            - watchdog_ping_url
        networks:
            - lucky-network
        profiles:
            - observability
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                tag: "{{.Name}}"

secrets:
    # Sourced from the host env vars Compose already has (no file on disk,
    # nothing read from .env* by this repo's code); mounted read-only at
    # /run/secrets/<name> inside whichever service declares them.
    smtp_password:
        environment: SMTP_PASSWORD
    watchdog_ping_url:
        environment: WATCHDOG_PING_URL

volumes:
    postgres_data:
    redis_data:
    prometheus_data:
    grafana_data:
    alertmanager_data:
    alertmanager_config:

networks:
    lucky-network:
        # Explicit name (not the Compose project-prefixed default): the
        # observability/README.md and docs/observability.md forwarder
        # recipes attach with `docker run --network lucky-network ...`,
        # which needs this exact network name to exist.
        name: lucky-network
        driver: bridge
    # External network shared with the homelab monitoring stack
    # (Prometheus, Grafana). Lucky owns/creates it; homelab joins it
    # as `external: true`. See homelab PR #135.
    lucky-monitoring:
        name: lucky-monitoring
        driver: bridge
    # External network holding only postgres, joined by the homelab Grafana
    # for its read-only Postgres datasource. Created by scripts/deploy.sh
    # (docker network create) so either side can start first.
    lucky-db-ro:
        name: lucky-db-ro
        external: true
