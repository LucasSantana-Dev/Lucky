resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    "~*https" https;
    "~*http" http;
    default https;
}

server {
    listen 8080;
    server_name _;

    # Blue/green upstream vars (rewritten by scripts/bluegreen-flip.sh and
    # mounted into the container at this path). Included inside the server block
    # because `set` is only valid in server/location/if contexts, not http.
    include /etc/nginx/conf.d/upstream-active.conf;

    client_max_body_size 50M;

    # Security headers (decisions/2026-06-11-security-headers-placement.md).
    # TLS terminates at the Cloudflare Tunnel; HSTS is set there, NOT here —
    # browsers ignore Strict-Transport-Security received over plain http.
    # /api gets its headers from helmet in the backend, so this block is
    # declared per-location below. NOTE: add_header in a location REPLACES
    # all inherited add_header directives — never rely on server-level
    # inheritance once a location sets its own.

    location /webhook/ {
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # NOTE: intentionally bypasses the blue/green upstream and targets the
        # single-color webhook service. Phase 1b must revisit if the
        # single-color services are retired.
        set $webhook_upstream http://webhook:9000;
        rewrite ^/webhook/(.*)$ /hooks/$1 break;
        proxy_pass $webhook_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Canonical invite URL, used by the Top.gg listing, the README CTA and
    # every tracked campaign link. nginx only proxies /api, so this path fell
    # through to the SPA, whose catch-all bounces unknown paths to the landing
    # page — every invite click was silently swallowed (#1888).
    #
    # Proxied to the backend rather than redirected here, because
    # backend/src/routes/invite.ts logs the utm_* parameters before redirecting.
    # A `return 302` at the edge would fix the click and still lose the
    # attribution that .agents/tracking-urls.md is built around (#1894).
    location = /invite {
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        # The rule wants `internal;`, which would make this location
        # unreachable from outside — this is a public entry point by design,
        # exactly like the /api and / blocks below. Its SSRF concern does not
        # apply: the upstream is a fixed literal with no request-derived input
        # in the URL, so a client cannot steer where the proxy connects.
        # NOTE: intentionally bypasses the blue/green upstream and targets the
        # single-color backend (kept alive by the staging pipeline). Phase 1b
        # must route this through $backend_upstream before the single-color
        # backend is retired, or the Top.gg invite entry point 502s.
        set $invite_upstream http://backend:3000;
        proxy_pass $invite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /api {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.discordapp.com https://cdn.discord.com; connect-src 'self' https://lucky-api.lucassantana.tech https://api.luk-homeserver.com.br https://*.sentry.io; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/security/csp-report" always;

        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}
