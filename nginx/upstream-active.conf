# Blue/green upstream configuration (included by nginx.conf).
# This file is rewritten by scripts/bluegreen-flip.sh to flip traffic
# between blue and green backend/frontend services.
#
# Default: single-color services (backend/frontend), NOT blue. The staging
# pipeline (deploy-staging.sh) only starts the single-color services and
# force-resets this tracked file on every deploy, so pointing at blue/green
# here would 502 staging until a manual flip. The flip script parses and
# rewrites these lines per tier; its parser treats backend/frontend
# single-color lines as the initial state and flips from there.

set $backend_upstream http://backend:3000;
set $frontend_upstream http://frontend:8080;
