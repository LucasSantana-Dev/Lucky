# Lucky — Prometheus alerting rules (Layer 3 of the observability remediation).
#
# Moved from monitoring/prometheus/ (ADR 2026-09-26, phase P2a). Auto-loaded by
# the `observability/prometheus/prometheus.yml` rule_files glob when the
# `observability` Compose profile is up. The `job` labels below (`lucky-backend`,
# `lucky-bot`, `lucky-render`) match the scrape_configs job_names in prometheus.yml.
#
# Metrics referenced (already exported today):
#   - lucky_backend_http_server_errors_total  (backend, counter, 5xx only)
#   - lucky_backend_http_requests_total        (backend, counter)
#   - lucky_bot_render_fallback_total{reason}  (bot, counter, recap card fallbacks)
#   - lucky_bot_recap_card_posted_total        (bot, counter, recap cards posted)
#   - up{job=...}                              (Prometheus scrape liveness)
#
# These are STARTER symptom alerts. Per ADR 2026-05-30, the availability SLO and a
# proper multi-window burn-rate are defined AFTER ~14 days of observed data.
#
# The lucky-resource-pressure group below (2026-07, #1657) supersedes the noisy
# homelab rules measured 23:1 noise:signal over 15 days: LuckyBotHeapHigh no
# longer divides by the lazily-grown V8 heap_total, and the memory alerts no
# longer count page cache as used memory. See
# decisions/2026-07-02-resource-hygiene-alert-calibration-first.md.
#
# The `container_memory_working_set_bytes` / `container_spec_memory_limit_bytes`
# series in the lucky-resource-pressure group come from cAdvisor, scraped as
# the `cadvisor` job in prometheus.yml. The `name` label matches each
# service's `container_name:` in docker-compose.yml (lucky-bot,
# lucky-backend, ...), so no expression changes were needed once cAdvisor
# was added.

groups:
  - name: lucky-backend-errors
    rules:
      - alert: LuckyBackendHighErrorRate
        expr: |
          sum(rate(lucky_backend_http_server_errors_total[5m]))
            / clamp_min(sum(rate(lucky_backend_http_requests_total[5m])), 1)
            > 0.05
        for: 5m
        labels:
          severity: warning
          service: lucky-backend
        annotations:
          summary: "Lucky backend 5xx error ratio > 5% (5m window)"
          description: >-
            More than 5% of backend requests returned 5xx over the last 5 minutes.
            Check recent deploy, Redis/DB connectivity, and Sentry for the release.

      - alert: LuckyBackendErrorBurstFast
        expr: |
          sum(rate(lucky_backend_http_server_errors_total[2m]))
            / clamp_min(sum(rate(lucky_backend_http_requests_total[2m])), 1)
            > 0.10
        for: 2m
        labels:
          severity: critical
          service: lucky-backend
        annotations:
          summary: "Lucky backend 5xx error ratio > 10% (fast burn, 2m window)"
          description: >-
            Backend is erroring on more than 10% of requests over 2 minutes —
            fast-burn signal of an outage or a bad release.

  - name: lucky-liveness
    rules:
      - alert: LuckyBackendScrapeDown
        expr: up{job="lucky-backend"} == 0
        for: 5m
        labels:
          severity: critical
          service: lucky-backend
        annotations:
          summary: "Prometheus cannot scrape the Lucky backend /metrics"
          description: >-
            The backend metrics endpoint has been unreachable for 5 minutes. The
            backend may be down. NOTE: this cannot fire if Prometheus itself is
            down — the off-box heartbeat (HEALTHCHECK_URL_EXTERNAL) covers that.

      - alert: LuckyBotScrapeDown
        expr: up{job="lucky-bot"} == 0
        for: 5m
        labels:
          severity: critical
          service: lucky-bot
        annotations:
          summary: "Prometheus cannot scrape the Lucky bot /metrics"
          description: >-
            The bot metrics endpoint (:9091) has been unreachable for 5 minutes.
            Cross-check the bot's Docker HEALTHCHECK (/healthz) and the heartbeat.

  - name: lucky-command-events
    rules:
      - alert: LuckyCommandEventsDropped
        # A single blip stays inside one 15m window and never lasts the
        # 30m `for:`; only drops that keep happening fire.
        expr: sum(increase(lucky_bot_command_events_dropped_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
          service: lucky-bot
        annotations:
          summary: "Command events are being dropped before reaching Postgres"
          description: >-
            lucky_bot_command_events_dropped_total has kept rising for at least
            30 minutes, so the business dashboard undercounts usage for this window. Check
            the `reason` label (overflow, flush_failure, stopped, internal_error,
            stop_timeout) and Postgres health; commands themselves keep working.

  - name: lucky-recap-render
    rules:
      - alert: LuckyRecapCardAllFellBack
        expr: |
          sum(increase(lucky_bot_render_fallback_total{reason!="disabled"}[12h])) > 0
            unless sum(increase(lucky_bot_recap_card_posted_total[12h])) > 0
        labels:
          severity: warning
          service: lucky-render
        annotations:
          summary: "Every weekly recap in the last 12h posted as text, no image card"
          description: >-
            Recaps fell back to the text embed and none was posted as the image
            card in the last 12 hours. Check lucky-render health and the
            `reason` label on lucky_bot_render_fallback_total (timeout,
            http_error, bad_response, network, no_attach_permission). The
            `disabled` reason (RECAP_RENDER_ENABLED kill switch) is excluded on
            purpose. `unless` keeps this firing when the card series was never
            incremented.

      - alert: LuckyRenderScrapeDown
        expr: up{job="lucky-render"} == 0
        for: 10m
        labels:
          severity: warning
          service: lucky-render
        annotations:
          summary: "Prometheus cannot scrape the lucky-render /metrics"
          description: >-
            The lucky-render sidecar metrics endpoint (:8080) has been
            unreachable for 10 minutes. Cross-check its Docker healthcheck;
            recaps fall back to the text embed while it is down.

  - name: lucky-resource-pressure
    rules:
      - alert: LuckyBotHeapHigh
        expr: |
          container_memory_working_set_bytes{name="lucky-bot"}
            / (container_spec_memory_limit_bytes{name="lucky-bot"} > 0)
            > 0.9
        for: 15m
        labels:
          severity: warning
          service: lucky-bot
        annotations:
          summary: "Lucky bot container working set > 90% of its memory limit"
          description: >-
            The bot container's working set (what the OOM killer acts on) has
            been above 90% of its mem_limit for 15 minutes. Replaces the old
            nodejs_heap_size_used/nodejs_heap_size_total ratio, which idled at
            92-96% on healthy processes because V8 grows heap_total lazily.

      - alert: HighMemoryUsage
        expr: |
          sum by (name) (container_memory_working_set_bytes{name!="lucky-bot"})
            / sum by (name) (container_spec_memory_limit_bytes{name!="lucky-bot"} > 0)
            > 0.85
        for: 15m
        labels:
          severity: warning
          service: homelab-containers
        annotations:
          summary: "Container {{ $labels.name }} working set > 85% of its memory limit"
          description: >-
            A container's working set has been above 85% of its mem_limit for 15
            minutes. Uses container_memory_working_set_bytes (excludes
            reclaimable page cache) instead of container_memory_usage_bytes,
            which fired on IO-heavy containers on cache, not real pressure.

      - alert: CriticalMemoryUsage
        expr: |
          sum by (name) (container_memory_working_set_bytes)
            / sum by (name) (container_spec_memory_limit_bytes > 0)
            > 0.95
        for: 10m
        labels:
          severity: critical
          service: homelab-containers
        annotations:
          summary: "Container {{ $labels.name }} working set > 95% of its memory limit"
          description: >-
            A container's working set has been above 95% of its mem_limit for 10
            minutes and is close to being OOM-killed. Uses working set (excludes
            page cache), not raw usage.

      - alert: HostMemoryHigh
        expr: |
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
            > 0.9
        for: 15m
        labels:
          severity: warning
          service: homelab-host
        annotations:
          summary: "Host memory headroom below 10%"
          description: >-
            Less than 10% of host memory is available (MemAvailable subtracts
            reclaimable page cache and buffers). A total-minus-free calculation
            overstates pressure because free excludes cache the kernel can
            reclaim on demand.
