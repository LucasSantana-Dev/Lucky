apiVersion: 1

policies:
  - orgId: 1
    receiver: email-primary
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Dead-man's-switch: Watchdog always fires, so it must repeat fast and
      # go to the off-box healthcheck, never to email (which would be one
      # email a minute forever).
      - receiver: watchdog-offbox
        object_matchers:
          - ["alertname", "=", "Watchdog"]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1m
        continue: false
