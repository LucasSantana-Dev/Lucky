# Grafana-managed alert rules, converted from observability/prometheus/rules/
# (ADR 2026-09-26, phase P2a; see observability/README.md "Alerting choice"
# for why Grafana evaluates these instead of running a separate Alertmanager).
# Each rule queries the `prometheus` datasource directly with the same PromQL
# used in the Prometheus rule files, so the two stay in lockstep by hand until
# P2b/P3 revisit this.
apiVersion: 1

groups:
  - orgId: 1
    name: lucky-backend-errors
    folder: Lucky
    interval: 1m
    rules:
      - uid: lucky-backend-high-error-rate
        title: LuckyBackendHighErrorRate
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(lucky_backend_http_server_errors_total[5m]))
                  / clamp_min(sum(rate(lucky_backend_http_requests_total[5m])), 1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: warning, service: lucky-backend }
        annotations:
          summary: "Lucky backend 5xx error ratio > 5% (5m window)"
          description: >-
            More than 5% of backend requests returned 5xx over the last 5
            minutes. Check recent deploy, Redis/DB connectivity, and Sentry
            for the release.

      - uid: lucky-backend-error-burst-fast
        title: LuckyBackendErrorBurstFast
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(lucky_backend_http_server_errors_total[2m]))
                  / clamp_min(sum(rate(lucky_backend_http_requests_total[2m])), 1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.10] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: critical, service: lucky-backend }
        annotations:
          summary: "Lucky backend 5xx error ratio > 10% (fast burn, 2m window)"
          description: >-
            Backend is erroring on more than 10% of requests over 2 minutes,
            a fast-burn signal of an outage or a bad release.

  - orgId: 1
    name: lucky-liveness
    folder: Lucky
    interval: 1m
    rules:
      - uid: lucky-backend-scrape-down
        title: LuckyBackendScrapeDown
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="lucky-backend"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: critical, service: lucky-backend }
        annotations:
          summary: "Prometheus cannot scrape the Lucky backend /metrics"
          description: >-
            The backend metrics endpoint has been unreachable for 5 minutes.
            The backend may be down.

      - uid: lucky-bot-scrape-down
        title: LuckyBotScrapeDown
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="lucky-bot"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: critical, service: lucky-bot }
        annotations:
          summary: "Prometheus cannot scrape the Lucky bot /metrics"
          description: >-
            The bot metrics endpoint (:9091) has been unreachable for 5
            minutes. Cross-check the bot's Docker HEALTHCHECK (/healthz) and
            the heartbeat.

  - orgId: 1
    name: lucky-disk
    folder: Lucky
    interval: 1m
    rules:
      - uid: lucky-disk-space-low
        title: LuckyDiskSpaceLow
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                  / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.20] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: warning, service: homelab-host }
        annotations:
          summary: "Disk free below 20%"
          description: >-
            A monitored filesystem has less than 20% free space for 15
            minutes.

      - uid: lucky-disk-space-critical
        title: LuckyDiskSpaceCritical
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                  / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.10] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: critical, service: homelab-host }
        annotations:
          summary: "Disk free below 10%"
          description: >-
            A monitored filesystem has less than 10% free space for 5
            minutes. The host is close to running out of disk.

      - uid: lucky-host-memory-high
        title: HostMemoryHigh
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: warning, service: homelab-host }
        annotations:
          summary: "Host memory headroom below 10%"
          description: >-
            Less than 10% of host memory is available (MemAvailable
            subtracts reclaimable page cache and buffers).

  - orgId: 1
    name: lucky-watchdog
    folder: Lucky
    interval: 1m
    rules:
      # Always-firing dead-man's-switch. Routed by policies.yaml to the
      # watchdog-offbox contact point with a 1m repeat interval. Losing this
      # ping means Prometheus or Grafana died, not that something broke in
      # the app.
      - uid: lucky-watchdog
        title: Watchdog
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: vector(1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: ["A"] }
                  reducer: { type: last }
        labels: { severity: none }
        annotations:
          summary: "Alerting pipeline heartbeat, always firing by design"
          description: >-
            Dead-man's-switch alert, always firing. Routes to an off-box
            healthcheck; losing this ping means Prometheus or Grafana died.
