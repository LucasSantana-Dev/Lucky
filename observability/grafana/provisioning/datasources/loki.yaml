apiVersion: 1

# Points at the homelab's existing shared Loki instance (see
# decisions/2026-06-16-info-log-aggregation-loki.md), not a Loki service
# this repo's docker-compose stands up (that is P2b, still pending per
# decisions/2026-09-26-lucky-owned-observability-stack.md). `lucky-monitoring`
# (not `lucky-network`) is the network shared with the homelab monitoring
# stack — Lucky creates it, the homelab joins it `external: true` (see
# homelab PR #135); bot/backend already attach to it in docker-compose.yml
# so the homelab Prometheus can scrape them. Grafana attaches to it too
# (docker-compose.yml `grafana.networks`) so `loki:3100` resolves, as long
# as the homelab Loki container joins that same network under the `loki`
# alias/name — verify this on first deploy and adjust `url` if the
# homelab's actual service name differs.
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
