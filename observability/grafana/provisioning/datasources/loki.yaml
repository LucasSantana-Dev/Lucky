apiVersion: 1

# Points at this profile's own Loki (`lucky-loki` on `lucky-network`, obs P2b,
# #2393), fed by Alloy (observability/alloy/config.alloy). The homelab Grafana
# does not read this file; it keeps its own Loki datasource until the cutover
# described in observability/README.md.
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://lucky-loki:3100
    editable: false
    jsonData:
      maxLines: 1000
